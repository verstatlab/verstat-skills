.react-flow__resize-control.top,
.react-flow__resize-control.bottom {
  cursor: ns-resize;
}
.react-flow__resize-control.top.left,
.react-flow__resize-control.bottom.right {
  cursor: nwse-resize;
}
.react-flow__resize-control.bottom.left,
.react-flow__resize-control.top.right {
  cursor: nesw-resize;
}
/* handle styles */
.react-flow__resize-control.handle {
  width: 4px;
  height: 4px;
  border: 1px solid #fff;
  border-radius: 1px;
  background-color: #3367d9;
  transform: translate(-50%, -50%);
}
.react-flow__resize-control.handle.left {
  left: 0;
  top: 50%;
}
.react-flow__resize-control.handle.right {
  left: 100%;
  top: 50%;
}
.react-flow__resize-control.handle.top {
  left: 50%;
  top: 0;
}
.react-flow__resize-control.handle.bottom {
  left: 50%;
  top: 100%;
}
.react-flow__resize-control.handle.top.left {
  left: 0;
}
.react-flow__resize-control.handle.bottom.left {
  left: 0;
}
.react-flow__resize-control.handle.top.right {
  left: 100%;
}
.react-flow__resize-control.handle.bottom.right {
  left: 100%;
}
/* line styles */
.react-flow__resize-control.line {
  border-color: #3367d9;
  border-width: 0;
  border-style: solid;
}
.react-flow__resize-control.line.left,
.react-flow__resize-control.line.right {
  width: 1px;
  transform: translate(-50%, 0);
  top: 0;
  height: 100%;
}
.react-flow__resize-control.line.left {
  left: 0;
  border-left-width: 1px;
}
.react-flow__resize-control.line.right {
  left: 100%;
  border-right-width: 1px;
}
.react-flow__resize-control.line.top,
.react-flow__resize-control.line.bottom {
  height: 1px;
  transform: translate(0, -50%);
  left: 0;
  width: 100%;
}
.react-flow__resize-control.line.top {
  top: 0;
  border-top-width: 1px;
}
.react-flow__resize-control.line.bottom {
  border-bottom-width: 1px;
  top: 100%;
}

.vs-cm { display: flex; flex-direction: column; border-top: var(--vs-rw) solid var(--vs-rule-strong); }
.vs-cm-row {
  display: flex;
  align-items: stretch;
  width: 100%;
  padding: 0;
  background: transparent;
  color: var(--vs-ink);
  border: none;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.vs-cm-graph { position: relative; flex: none; align-self: stretch; }
.vs-cm-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }

.vs-cm-body {

.vs-cm-row[aria-pressed="true"] .vs-cm-body { background: var(--vs-surface); }
.vs-cm-sha, .vs-cm-repo, .vs-cm-stat { font-family: var(--vs-mono); font-size: 12px; color: var(--vs-muted); }
.vs-cm-repo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vs-cm-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vs-cm-msg { font-family: var(--vs-mono); font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }

.vs-cm-tag {

  font-weight: 400;
  color: var(--vs-muted);
  vertical-align: 1px;
}
.vs-cm-intent { font-size: 13px; color: var(--vs-muted); }
.vs-cm-stat { white-space: nowrap; }

.vs-acc { border-top: var(--vs-rw) solid var(--vs-rule-strong); }
.vs-acc-item { border-bottom: 1px solid var(--vs-rule); }
.vs-acc-item.vs-focus { outline-offset: -2px; }
.vs-acc-head {
  display: grid;
  grid-template-columns: 96px 1fr auto 20px;
  gap: 12px;
  align-items: baseline;
  width: 100%;
  padding: 12px 0;
  background: transparent;
  color: var(--vs-ink);
  border: none;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.vs-acc-head:hover .vs-acc-title > span:first-child { color: var(--vs-accent-ink); }
.vs-acc-kind { font-family: var(--vs-mono); font-size: 11px; letter-spacing: .04em; color: var(--vs-muted); }
.vs-acc-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 15px; font-weight: 600; }
.vs-acc-path { font-family: var(--vs-mono); font-size: 12px; font-weight: 400; color: var(--vs-muted); overflow-wrap: anywhere; }
.vs-acc-count { font-family: var(--vs-mono); font-size: 12px; color: var(--vs-muted); white-space: nowrap; }
.vs-acc-sign { font-family: var(--vs-mono); font-size: 16px; text-align: center; color: var(--vs-muted); }
.vs-acc-body { padding: 0 0 14px 108px; display: flex; flex-direction: column; gap: 8px; }
.vs-acc-body[hidden] { display: none; }
.vs-acc-note { font-size: 14px; color: var(--vs-muted); }
.vs-acc-pre {
  margin: 0;
  padding: 10px 12px;
  background: var(--vs-code-bg);
  border: 1px solid var(--vs-rule);
  border-radius: var(--vs-r);
  font-family: var(--vs-mono);
  font-size: 12px;
  line-height: 1.6;
  overflow-x: auto;
}
.vs-acc-line { display: block; min-height: 1.6em; white-space: pre; min-width: 100%; width: max-content; }
.vs-acc-add { background: var(--vs-add-soft); }
.vs-acc-del { background: var(--vs-del-soft); }
.vs-acc-mark { display: inline-block; width: 18px; font-weight: 700; }
.vs-acc-path-line { color: var(--vs-muted); font-weight: 600; }

@media (max-width: 720px) {
  .vs-cm-body { grid-template-columns: 64px 1fr auto; row-gap: 4px; gap: 8px; margin-left: 6px; }
  .vs-cm-norepo .vs-cm-body { grid-template-columns: 64px 1fr; }
  .vs-cm-text { grid-column: 1 / -1; grid-row: 2; }
  .vs-acc-head { grid-template-columns: 1fr auto 20px; }
  .vs-acc-kind { grid-column: 1 / -1; }
  .vs-acc-body { padding-left: 0; }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--vs-bg);
  color: var(--vs-ink);
  font-family: var(--vs-font);
  font-size: 15px;
  line-height: 1.55;

  overflow-x: hidden;
}

button { font: inherit; color: inherit; }
a { color: var(--vs-accent-ink); }

:focus-visible { outline: 2px solid var(--vs-accent); outline-offset: 2px; }

.vs-mono { font-family: var(--vs-mono); }
.vs-muted { color: var(--vs-muted); }

.vs-logo-mark .vs-logo-v { fill: var(--vs-accent); }
.vs-logo-text { display: flex; flex-direction: column; gap: 3px; line-height: 1; }

.vs-logo-skill { font-size: 19px; letter-spacing: -.03em; }
.vs-bar-repos { display: flex; gap: 4px 14px; flex-wrap: wrap; font-family: var(--vs-mono); font-size: 12px; color: var(--vs-muted); min-width: 0; }

  gap: 8px;
  font-family: var(--vs-mono);

.vs-seg { display: inline-flex; }

  font-size: 13px;
  font-weight: 600;
  padding: 6px 12px;
  cursor: pointer;
  text-align: left;
  background: transparent;
  color: var(--vs-ink);
  border: var(--vs-rw) solid var(--vs-rule-strong);
  border-radius: 0;

.vs-seg button:last-child { border-radius: 0 var(--vs-r) var(--vs-r) 0; }
.vs-seg button[aria-pressed="true"] { background: var(--vs-surface); color: var(--vs-ink); }

.vs-seg button:disabled { color: var(--vs-muted); cursor: default; opacity: .6; }
.vs-seg-wide { display: flex; }

.vs-steps { display: flex; flex-direction: column; border-top: var(--vs-rw) solid var(--vs-rule-strong); }
.vs-step {
  display: grid;
  grid-template-columns: 14px 1fr auto;
  gap: 10px;
  align-items: start;
  padding: 10px 0;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--vs-rule);
  cursor: pointer;
  text-align: left;
  color: var(--vs-muted);
}
.vs-step:hover { color: var(--vs-accent-ink); }
.vs-step.vs-current { color: var(--vs-ink); }
.vs-step-marker { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; border: 1.5px solid var(--vs-rule-strong); }
.vs-step.vs-passed .vs-step-marker { background: var(--vs-muted); border-color: var(--vs-muted); }
.vs-step.vs-current .vs-step-marker { background: var(--vs-accent); border-color: var(--vs-accent); }
.vs-step-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vs-step-title { font-size: 14px; line-height: 1.3; }
.vs-step.vs-current .vs-step-title { font-weight: 600; }
.vs-step-why { font-size: 12px; color: var(--vs-muted); line-height: 1.35; }
.vs-step-min { font-family: var(--vs-mono); font-size: 11px; color: var(--vs-muted); padding-top: 2px; }
.vs-rail-foot { font-family: var(--vs-mono); font-size: 12px; color: var(--vs-muted); display: flex; justify-content: space-between; gap: 8px; }

.vs-strip-modes { display: flex; align-items: center; flex: none; }
.vs-strip-steps { display: flex; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: thin; }
.vs-strip-step {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
  padding: 10px 14px 8px;
  background: transparent;
  border: none;
  border-bottom: 4px solid transparent;
  cursor: pointer;
  text-align: left;
  color: var(--vs-muted);
  max-width: 220px;
}
.vs-strip-step:hover { background: var(--vs-surface); }
.vs-strip-step.vs-current { border-bottom-color: var(--vs-accent); color: var(--vs-ink); }
.vs-strip-step-num { font-family: var(--vs-mono); font-size: 11px; color: var(--vs-muted); }
.vs-strip-step-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

.vs-block { border-top: var(--vs-rw) solid var(--vs-rule-strong); padding: 28px 0 40px; scroll-margin-top: 8px; }
.vs-block:first-child { border-top: none; }
.vs-block-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.vs-kicker { font-family: var(--vs-mono); font-size: 12px; color: var(--vs-muted); }
.vs-block.vs-active .vs-kicker { color: var(--vs-accent-ink); }
.vs-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.vs-action {
  font-family: var(--vs-mono);
  font-size: 12px;
  background: transparent;
  border: 1px solid var(--vs-rule);
  border-radius: var(--vs-r);
  padding: 4px 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;

.vs-block h2 { font-size: 28px; line-height: 1.15; margin-top: 10px; }
.vs-sub { font-size: 15px; color: var(--vs-muted); max-width: 66ch; margin-top: 8px; }
.vs-block-body { margin-top: 22px; }

.vs-block.vs-collapsed .vs-collapsed-note { display: block; }

.vs-focus { outline: 2px solid var(--vs-accent); outline-offset: 3px; border-radius: 2px; }

.vs-chip {

.vs-source { font-size: 11px; padding: 2px 6px; background: transparent; border-color: var(--vs-ink); }

he"," * [Consolidate.js](https://github.com/tj/consolidate.js)"," * library was created to map all of node's popular template"," * engines to follow this convention, thus allowing them to"," * work seamlessly within Express."," *"," * @param {String} ext"," * @param {Function} fn"," * @return {app} for chaining"," * @public"," */","","app.engine = function engine(ext, fn) {","  if (typeof fn !== 'function') {","    throw new Error('callback function required');","  }","","  // get file extension","  var extension = ext[0] !== '.'","    ? '.' + ext","    : ext;","","  // store engine","  this.engines[extension] = fn;","","  return this;","};","","/**"," * Proxy to `Router#param()` with one added api feature. The _name_ parameter"," * can be an array of names."," *"," * See the Router#param() docs for more details."," *"," * @param {String|Array} name"," * @param {Function} fn"," * @return {app} for chaining"," * @public"," */","","app.param = function param(name, fn) {","  if (Array.isArray(name)) {","    for (var i = 0; i \u003c name.length; i++) {","      this.param(name[i], fn);","    }","","    return this;","  }","","  this.router.param(name, fn);","","  return this;","};","","/**"," * Assign `setting` to `val`, or return `setting`'s value."," *"," *    app.set('foo', 'bar');"," *    app.set('foo');"," *    // => \"bar\""," *"," * Mounted servers inherit their parent server's settings."," *"," * @param {String} setting"," * @param {*} [val]"," * @return {Server} for chaining"," * @public"," */","","app.set = function set(setting, val) {","  if (arguments.length === 1) {","    // app.get(setting)","    return this.settings[setting];","  }","","  debug('set \"%s\" to %o', setting, val);","","  // set value","  this.settings[setting] = val;","","  // trigger matched settings","  switch (setting) {","    case 'etag':","      this.set('etag fn', compileETag(val));","      break;","    case 'query parser':","      this.set('query parser fn', compileQueryParser(val));","      break;","    case 'trust proxy':","      this.set('trust proxy fn', compileTrust(val));","","      // trust proxy inherit back-compat","      Object.defineProperty(this.settings, trustProxyDefaultSymbol, {","        configurable: true,","        value: false","      });","","      break;","  }","","  return this;","};","","/**"," * Return the app's absolute pathname"," * based on the parent(s) that have"," * mounted it."," *"," * For example if the application was"," * mounted as \"/admin\", which itself"," * was mounted as \"/blog\" then the"," * return value would be \"/blog/admin\"."," *"," * @return {String}"," * @private"," */","","app.path = function path() {","  return this.parent","    ? this.parent.path() + this.mountpath","    : '';","};","","/**"," * Check if `setting` is enabled (truthy)."," *"," *    app.enabled('foo')"," *    // => false"," *"," *    app.enable('foo')"," *    app.enabled('foo')"," *    // => true"," *"," * @param {String} setting"," * @return {Boolean}"," * @public"," */","","app.enabled = function enabled(setting) {","  return Boolean(this.set(setting));","};","","/**"," * Check if `setting` is disabled."," *"," *    app.disabled('foo')"," *    // => true"," *"," *    app.enable('foo')"," *    app.disabled('foo')"," *    // => false"," *"," * @param {String} setting"," * @return {Boolean}"," * @public"," */","","app.disabled = function disabled(setting) {","  return !this.set(setting);","};","","/**"," * Enable `setting`."," *"," * @param {String} setting"," * @return {app} for chaining"," * @public"," */","","app.enable = function enable(setting) {","  return this.set(setting, true);","};","","/**"," * Disable `setting`."," *"," * @param {String} setting"," * @return {app} for chaining"," * @public"," */","","app.disable = function disable(setting) {","  return this.set(setting, false);","};","","/**"," * Delegate `.VERB(...)` calls to `router.VERB(...)`."," */","","methods.forEach(function (method) {","  app[method] = functi ","lines":["/*!"," * router"," * Copyright(c) 2013 Roman Shtylman"," * Copyright(c) 2014-2022 Douglas Christopher Wilson"," * MIT Licensed"," */","","'use strict'","","/**"," * Module dependencies."," * @private"," */","","const isPromise = require('is-promise')","const pathRegexp = require('path-to-regexp')","const debug = require('debug')('router:layer')","const deprecate = require('depd')('router')","","/**"," * Module variables."," * @private"," */","","const TRAILING_SLASH_REGEXP = /\\/+$/","const MATCHING_GROUP_REGEXP = /\\((?:\\?\u003c(.*?)>)?(?!\\?)/g","","/**"," * Expose `Layer`."," */","","module.exports = Layer","","function Layer (path, options, fn) {","  if (!(this instanceof Layer)) {","    return new Layer(path, options, fn)","  }","","  debug('new %o', path)","  const opts = options || {}","","  this.handle = fn","  this.keys = []","  this.name = fn.name || '\u003canonymous>'","  this.params = undefined","  this.path = undefined","  this.slash = path === '/' && opts.end === false","","  function matcher (_path) {","    if (_path instanceof RegExp) {","      const keys = []","      let name = 0","      let m","      // eslint-disable-next-line no-cond-assign","      while (m = MATCHING_GROUP_REGEXP.exec(_path.source)) {","        keys.push({","          name: m[1] || name++,","          offset: m.index","        })","      }","","      return function regexpMatcher (p) {","        const match = _path.exec(p)","        if (!match) {","          return false","        }","","        const params = {}","        for (let i = 1; i \u003c match.length; i++) {","          const key = keys[i - 1]","          const prop = key.name","          const val = decodeParam(match[i])","","          if (val !== undefined) {","            params[prop] = val","          }","        }","","        return {","          params,","          path: match[0]","        }","      }","    }","","    return pathRegexp.match((opts.strict ? _path : loosen(_path)), {","      sensitive ","const deprecate = require('depd')('router')","","/**"," * Module variables."," * @private"," */","","const slice = Array.prototype.slice","const flatten = Array.prototype.flat","const methods = METHODS.map((method) => method.toLowerCase())","","/**"," * Expose `Router`."," */","","module.exports = Router","","/**"," * Expose `Route`."," */","","module.exports.Route = Route","","/**"," * Initialize a new `Router` with the given `options`."," *"," * @param {object} [options]"," * @return {Router} which is a callable function"," * @public"," */","","function Router (options) {","  if (!(this instanceof Router)) {","    return new Router(options)","  }","","  const opts = options || {}","","  function router (req, res, next) {","    router.handle(req, res, next)","  }","","  // inherit from the correct prototype","  Object.setPrototypeOf(router, this)","","  router.caseSensitive = opts.caseSensitive","  router.mergeParams = opts.mergeParams","  router.params = {}","  router.strict = opts.strict","  router.stack = []","","  return router","}","","/**"," * Router prototype inherits from a Function."," */","","/* istanbul ignore next */","Router.prototype = function () {}","","/**"," * Map the given param placeholder `name`(s) to the given callback."," *"," * Parameter mapping is used to provide pre-conditions to routes"," * which use normalized placeholders. For example a _:user_id_ parameter"," * could automatically load a user's information from the database without"," * any additional code."," *"," * The callback uses the same signature as middleware, the only difference"," * being that the value of the placeholder is passed, in this case the _id_"," * of the user. Once the `next()` function is invoked, just like middleware"," * it will continue on to execute the route, or subsequent parameter functions."," *"," * Just like in middleware, you must either respond to the request or call next"," * to avoid stalling the request."," *"," *  router.param('user_id', functi cy', \"default-src 'none'\")","    res.setHeader('X-Content-Type-Options', 'nosniff')","","    // standard headers","    res.setHeader('Content-Type', 'text/html; charset=utf-8')","    res.setHeader('Content-Length', Buffer.byteLength(body, 'utf8'))","","    if (req.method === 'HEAD') {","      res.end()","      return","    }","","    res.end(body, 'utf8')","  }","","  if (isFinished(req)) {","    write()","    return","  }","","  // unpipe everything from the request","  req.unpipe()","","  // flush the request","  onFinished(req, write)","  req.resume()","}"]},"express:test/app.use.js":{"sha":"cf6722bf89a86905281d9160b6482e08166b5ef0","lines":["'use strict'","","var after = require('after');","var assert = require('node:assert')","var express = require('..');","var request = require('supertest');","","describe('app', function(){","  it('should emit \"mount\" when mounted', function(done){","    var blog = express()","      , app = express();","","    blog.on('mount', function(arg){","      assert.strictEqual(arg, app)","      done();","    });","","    app.use(blog);","  })","","  describe('.use(app)', function(){","    it('should mount the app', function(done){","      var blog = express()","        , app = express();","","      blog.get('/blog', function(req, res){","        res.end('blog');","      });","","      app.use(blog);","","      request(app)","      .get('/blog')","      .expect('blog', done);","    })","","    it('should support mount-points', function(done){","      var blog = express()","        , forum = express()","        , app = express();","      var cb = after(2, done)","","      blog.get('/', function(req, res){","        res.end('blog');","      });","","      forum.get('/', function(req, res){","        res.end('forum');","      });","","      app.use('/blog', blog);","      app.use('/forum', forum);","","      request(app)","        .get('/blog')","        .expect(200, 'blog', cb)","","      request(app)","        .get('/forum')"," (function () {
  'use strict';

  var drawerOpener = null;
  var armed = null;

  function fileOf(anchor) {
    return anchor && vs.page.code && vs.page.code[anchor.repo + ':' + anchor.path];
  }

  }

  function where(anchor) {

    return vs.t(spans.length > 1 || spans[0][1] > spans[0][0] ? 'anchors.lines' : 'anchors.line', { lines: lineLabel(anchor) });
  }

  function copyText(anchor) {

  }

  function shaOf(anchor) {

        vs.el('span', { class: 'vs-code-num' }, String(n)),

  function openDrawer(anchor, opener) {

    var close = vs.el('button', { type: 'button', class: 'vs-iconbtn', title: vs.t('anchors.close'), 'aria-label': vs.t('anchors.close'), onclick: closeDrawer }, vs.icon('x', 15));

            vs.el('span', { class: 'vs-drawer-meta' }, anchor.repo + '@' + shaOf(anchor) + ' · ' + where(anchor)),

      ]),

    drawer.hidden = false;

    var spans = spansOf(anchor);

      var hovered = null;

        if (e.relatedTarget) return;

        arm(null);
      });
    },

verstat.register("system-map", (() => {

  const style = document.createElement('style');
  style.setAttribute('data-vs-type', 'system-map');
  style.textContent = `
.vs-sm { display: flex; flex-direction: column; gap: 10px; }
.vs-sm-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 12px; color: var(--vs-muted); }
.vs-sm-links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.vs-sm-links li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.vs-sm-links .vs-sm-to { font-weight: 600; }
.vs-sm-muted { color: var(--vs-muted); }

const LEVELS = ['system', 'service', 'module'];

function levels(block, warn) {

    if (!l.nodes.length) return;
    if (seen.has(l.level)) {
      if (warn) warn('level "' + l.level + '" appears more than once; only the first is shown');
      return;

    seen.set(l.level, l);

  return LEVELS.filter((name) => seen.has(name)).map((name) => seen.get(name));

  const has = (l) => l.nodes.some((n) => n.id === id || n.group === id) || (l.links || []).some((k) => k.id === id);
  const list = levels(block);

    const group = groupById.get(n.group);
    const outs = currentLinks.filter((k) => k.from === n.id);
    const ins = currentLinks.filter((k) => k.to === n.id);

      cell(ctx.t('system-map.node'), [
        el('span', { class: 'vs-flow-v vs-flow-strong' }, n.label),
        el('span', { class: 'vs-sm-muted' }, ctx.t(`system-map.kind.${n.kind}`, null, n.kind) + (group ? ' · ' + group.label : '')),
      ]),
      n.note ? cell(ctx.t('system-map.note'), el('span', { class: 'vs-flow-v' }, n.note)) : null,

.vs-tc-sum b { font-weight: 600; }

.vs-tc-note { font-size: 12.5px; line-height: 1.4; color: var(--vs-muted); }

    el('div', { class: 'vs-table' }, el('div', { class: 'vs-table-grid', style: `--vs-table-cols:${COLS};--vs-table-min:600px` }, [
