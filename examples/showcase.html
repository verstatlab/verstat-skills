.react-flow__resize-control.top,
.react-flow__resize-control.bottom {
  cursor: ns-resize;
}
.react-flow__resize-control.top.left,
.react-flow__resize-control.bottom.right {
  cursor: nwse-resize;
}
.react-flow__resize-control.bottom.left,
.react-flow__resize-control.top.right {
  cursor: nesw-resize;
}
/* handle styles */
.react-flow__resize-control.handle {
  width: 4px;
  height: 4px;
  border: 1px solid #fff;
  border-radius: 1px;
  background-color: #3367d9;
  transform: translate(-50%, -50%);
}
.react-flow__resize-control.handle.left {
  left: 0;
  top: 50%;
}
.react-flow__resize-control.handle.right {
  left: 100%;
  top: 50%;
}
.react-flow__resize-control.handle.top {
  left: 50%;
  top: 0;
}
.react-flow__resize-control.handle.bottom {
  left: 50%;
  top: 100%;
}
.react-flow__resize-control.handle.top.left {
  left: 0;
}
.react-flow__resize-control.handle.bottom.left {
  left: 0;
}
.react-flow__resize-control.handle.top.right {
  left: 100%;
}
.react-flow__resize-control.handle.bottom.right {
  left: 100%;
}
/* line styles */
.react-flow__resize-control.line {
  border-color: #3367d9;
  border-width: 0;
  border-style: solid;
}
.react-flow__resize-control.line.left,
.react-flow__resize-control.line.right {
  width: 1px;
  transform: translate(-50%, 0);
  top: 0;
  height: 100%;
}
.react-flow__resize-control.line.left {
  left: 0;
  border-left-width: 1px;
}
.react-flow__resize-control.line.right {
  left: 100%;
  border-right-width: 1px;
}
.react-flow__resize-control.line.top,
.react-flow__resize-control.line.bottom {
  height: 1px;
  transform: translate(0, -50%);
  left: 0;
  width: 100%;
}
.react-flow__resize-control.line.top {
  top: 0;
  border-top-width: 1px;
}
.react-flow__resize-control.line.bottom {
  border-bottom-width: 1px;
  top: 100%;
}

.vs-cm { display: flex; flex-direction: column; border-top: var(--vs-rw) solid var(--vs-rule-strong); }
.vs-cm-row {
  display: flex;
  align-items: stretch;
  width: 100%;
  padding: 0;
  background: transparent;
  color: var(--vs-ink);
  border: none;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.vs-cm-graph { position: relative; flex: none; align-self: stretch; }
.vs-cm-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }

.vs-cm-body {

.vs-cm-row[aria-pressed="true"] .vs-cm-body { background: var(--vs-surface); }
.vs-cm-sha, .vs-cm-repo, .vs-cm-stat { font-family: var(--vs-mono); font-size: 12px; color: var(--vs-muted); }
.vs-cm-repo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vs-cm-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vs-cm-msg { font-family: var(--vs-mono); font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }

.vs-cm-tag {

  font-weight: 400;
  color: var(--vs-muted);
  vertical-align: 1px;
}
.vs-cm-intent { font-size: 13px; color: var(--vs-muted); }
.vs-cm-stat { white-space: nowrap; }

.vs-acc { border-top: var(--vs-rw) solid var(--vs-rule-strong); }
.vs-acc-item { border-bottom: 1px solid var(--vs-rule); }
.vs-acc-item.vs-focus { outline-offset: -2px; }
.vs-acc-head {
  display: grid;
  grid-template-columns: 96px 1fr auto 20px;
  gap: 12px;
  align-items: baseline;
  width: 100%;
  padding: 12px 0;
  background: transparent;
  color: var(--vs-ink);
  border: none;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.vs-acc-head:hover .vs-acc-title > span:first-child { color: var(--vs-accent-ink); }
.vs-acc-kind { font-family: var(--vs-mono); font-size: 11px; letter-spacing: .04em; color: var(--vs-muted); }
.vs-acc-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 15px; font-weight: 600; }
.vs-acc-path { font-family: var(--vs-mono); font-size: 12px; font-weight: 400; color: var(--vs-muted); overflow-wrap: anywhere; }
.vs-acc-count { font-family: var(--vs-mono); font-size: 12px; color: var(--vs-muted); white-space: nowrap; }
.vs-acc-sign { font-family: var(--vs-mono); font-size: 16px; text-align: center; color: var(--vs-muted); }
.vs-acc-body { padding: 0 0 14px 108px; display: flex; flex-direction: column; gap: 8px; }
.vs-acc-body[hidden] { display: none; }
.vs-acc-note { font-size: 14px; color: var(--vs-muted); }
.vs-acc-pre {
  margin: 0;
  padding: 10px 12px;
  background: var(--vs-code-bg);
  border: 1px solid var(--vs-rule);
  border-radius: var(--vs-r);
  font-family: var(--vs-mono);
  font-size: 12px;
  line-height: 1.6;
  overflow-x: auto;
}
.vs-acc-line { display: block; min-height: 1.6em; white-space: pre; min-width: 100%; width: max-content; }
.vs-acc-add { background: var(--vs-add-soft); }
.vs-acc-del { background: var(--vs-del-soft); }
.vs-acc-mark { display: inline-block; width: 18px; font-weight: 700; }
.vs-acc-path-line { color: var(--vs-muted); font-weight: 600; }

@media (max-width: 720px) {
  .vs-cm-body { grid-template-columns: 64px 1fr auto; row-gap: 4px; gap: 8px; margin-left: 6px; }
  .vs-cm-norepo .vs-cm-body { grid-template-columns: 64px 1fr; }
  .vs-cm-text { grid-column: 1 / -1; grid-row: 2; }
  .vs-acc-head { grid-template-columns: 1fr auto 20px; }
  .vs-acc-kind { grid-column: 1 / -1; }
  .vs-acc-body { padding-left: 0; }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--vs-bg);
  color: var(--vs-ink);
  font-family: var(--vs-font);
  font-size: 15px;
  line-height: 1.55;

  overflow-x: hidden;
}

button { font: inherit; color: inherit; }
a { color: var(--vs-accent-ink); }

:focus-visible { outline: 2px solid var(--vs-accent); outline-offset: 2px; }

.vs-mono { font-family: var(--vs-mono); }
.vs-muted { color: var(--vs-muted); }

.vs-logo-mark .vs-logo-v { fill: var(--vs-accent); }
.vs-logo-text { display: flex; flex-direction: column; gap: 3px; line-height: 1; }

.vs-logo-skill { font-size: 19px; letter-spacing: -.03em; }
.vs-bar-repos { display: flex; gap: 4px 14px; flex-wrap: wrap; font-family: var(--vs-mono); font-size: 12px; color: var(--vs-muted); min-width: 0; }

  gap: 8px;
  font-family: var(--vs-mono);

.vs-seg { display: inline-flex; }

  font-size: 13px;
  font-weight: 600;
  padding: 6px 12px;
  cursor: pointer;
  text-align: left;
  background: transparent;
  color: var(--vs-ink);
  border: var(--vs-rw) solid var(--vs-rule-strong);
  border-radius: 0;

.vs-seg button:last-child { border-radius: 0 var(--vs-r) var(--vs-r) 0; }
.vs-seg button[aria-pressed="true"] { background: var(--vs-surface); color: var(--vs-ink); }

.vs-seg button:disabled { color: var(--vs-muted); cursor: default; opacity: .6; }
.vs-seg-wide { display: flex; }

.vs-steps { display: flex; flex-direction: column; border-top: var(--vs-rw) solid var(--vs-rule-strong); }
.vs-step {
  display: grid;
  grid-template-columns: 14px 1fr auto;
  gap: 10px;
  align-items: start;
  padding: 10px 0;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--vs-rule);
  cursor: pointer;
  text-align: left;
  color: var(--vs-muted);
}
.vs-step:hover { color: var(--vs-accent-ink); }
.vs-step.vs-current { color: var(--vs-ink); }
.vs-step-marker { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; border: 1.5px solid var(--vs-rule-strong); }
.vs-step.vs-passed .vs-step-marker { background: var(--vs-muted); border-color: var(--vs-muted); }
.vs-step.vs-current .vs-step-marker { background: var(--vs-accent); border-color: var(--vs-accent); }
.vs-step-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vs-step-title { font-size: 14px; line-height: 1.3; }
.vs-step.vs-current .vs-step-title { font-weight: 600; }
.vs-step-why { font-size: 12px; color: var(--vs-muted); line-height: 1.35; }
.vs-step-min { font-family: var(--vs-mono); font-size: 11px; color: var(--vs-muted); padding-top: 2px; }
.vs-rail-foot { font-family: var(--vs-mono); font-size: 12px; color: var(--vs-muted); display: flex; justify-content: space-between; gap: 8px; }

.vs-strip-modes { display: flex; align-items: center; flex: none; }
.vs-strip-steps { display: flex; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: thin; }
.vs-strip-step {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
  padding: 10px 14px 8px;
  background: transparent;
  border: none;
  border-bottom: 4px solid transparent;
  cursor: pointer;
  text-align: left;
  color: var(--vs-muted);
  max-width: 220px;
}
.vs-strip-step:hover { background: var(--vs-surface); }
.vs-strip-step.vs-current { border-bottom-color: var(--vs-accent); color: var(--vs-ink); }
.vs-strip-step-num { font-family: var(--vs-mono); font-size: 11px; color: var(--vs-muted); }
.vs-strip-step-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

.vs-block { border-top: var(--vs-rw) solid var(--vs-rule-strong); padding: 28px 0 40px; scroll-margin-top: 8px; }
.vs-block:first-child { border-top: none; }
.vs-block-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.vs-kicker { font-family: var(--vs-mono); font-size: 12px; color: var(--vs-muted); }
.vs-block.vs-active .vs-kicker { color: var(--vs-accent-ink); }
.vs-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.vs-action {
  font-family: var(--vs-mono);
  font-size: 12px;
  background: transparent;
  border: 1px solid var(--vs-rule);
  border-radius: var(--vs-r);
  padding: 4px 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;

.vs-block h2 { font-size: 28px; line-height: 1.15; margin-top: 10px; }
.vs-sub { font-size: 15px; color: var(--vs-muted); max-width: 66ch; margin-top: 8px; }
.vs-block-body { margin-top: 22px; }

.vs-block.vs-collapsed .vs-collapsed-note { display: block; }

.vs-focus { outline: 2px solid var(--vs-accent); outline-offset: 3px; border-radius: 2px; }

.vs-chip {

.vs-source { font-size: 11px; padding: 2px 6px; background: transparent; border-color: var(--vs-ink); }

y moved.","modes":["full"]},{"block":"noise","minutes":0.25,"why":"Skip the import churn.","modes":["full"]},{"block":"risks","minutes":0.5,"why":"What could go wrong.","modes":["full"]},{"block":"where","minutes":0.25,"why":"Places to open in the code.","modes":["full"]},{"block":"questions","minutes":0.25,"why":"What the change leaves open.","modes":["full"]},{"block":"change","minutes":0.5,"why":"Where to start the next change.","modes":["full"]},{"block":"focus","minutes":1,"why":"Where to spend review time.","modes":["short","full"]}],"openQuestions":["Should the hint mail be sent again when a customer adds items but is still below the threshold? Today it is sent once, when the order is created."],"code":{"shop:src/orders.js":{"sha":"c7c72dcf0afd580f25d145d28106b8fecdf282ac","lines":["import { config } from './config.js';","import { db, newId } from './db.js';","import { deliveryCost } from './delivery.js';","import { publish } from './events.js';","import { refund } from './payments.js';","","const DAY = 24 * 60 * 60 * 1000;","","export const STATUS = {","  created: 'created',","  paid: 'paid',","  shipped: 'shipped',","  delivered: 'delivered',","  refunded: 'refunded',","};","","export function createOrder(customerId, items, now = Date.now()) {","  if (!db.customers.has(customerId)) throw new Error('unknown customer');","  if (!items?.length) throw new Error('empty order');","  const subtotal = items.reduce((sum, item) => sum + item.price * item.qty, 0);","  const weightKg = items.reduce((sum, item) => sum + item.weightKg * item.qty, 0);","  const order = { id: newId('order'), customerId, items, subtotal, weightKg, status: STATUS.created, createdAt: now };","  order.delivery = deliveryCost(order);","  order.total = order.subtotal + order.delivery;","  db.orders.set(order.id, order);","  publish('order.created', order);","  return order;","}","","function advance(orderId, from, to, now) {","  const order = db.orders.get(orderId);","  if (!order) throw new Error('unknown order');","  if (order.status !== from) throw new Error(`order is ${order.status}, not ${from}`);","  order.status = to;","  order[`${to}At`] = now;","  publish(`order.${to}`, order);","  return order;","}","","export function pay(orderId, now = Date.now()) {","  return advance(orderId, STATUS.created, STATUS.paid, now);","}","","export function ship(orderId, now = Date.now()) {","  return advance(orderId, STATUS.paid, STATUS.shipped, now);","}","","export function deliver(orderId, now = Date.now()) {","  return advance(orderId, STATUS.shipped, STATUS.delivered, now);","}","","export function cancel(orderId, now = Date.now()) {","  const order = advance(orderId, STATUS.paid, STATUS.refunded, now);","  refund(order, order.total);","  return order;","}","","export function refundUnshipped(now = Date.now()) {","  const changed = [];","  for (const order of db.orders.values()) {","    if (order.status === STATUS.paid && now > order.paidAt + config.shipWithinDays * DAY) {","      changed.push(cancel(order.id, now));","    }","  }","  return changed;","}"]},"shop:src/delivery.js":{"sha":"c7c72dcf0afd580f25d145d28106b8fecdf282ac","lines":["import { config } from './config.js';","","export function deliveryCost(order) {","  if (order.subtotal >= config.freeDeliveryFrom) return 0;","  const kg = Math.ceil(order.weightKg);","  const cost = config.deliveryBase + kg * config.deliveryPerKg;","  return Math.min(cost, config.maxDelivery);","}"]},"shop:config/default.json":{"sha":"c7c72dcf0afd580f25d145d28106b8fecdf282ac","lines":["{","  \"deliveryBase\": 490,","  \"deliveryPerKg\": 150,","  \"maxDelivery\": 2500,","  \"freeDeliveryFrom\": 5000,","  \"shipWithinDays\": 3,","  \"unshippedCheckMinutes\": 60","}"]},"shop:src/jobs/unshipped.js":{"sha":"c7c72dcf0afd580f25d145d28106b8fecdf282ac","lines":["import { config } from '../config.js';","import { refundUnshipped } from '../orders.js';","","export function startUnshippedJob() {","  return setInterval(() => refundUnshipped(), config.unshippedCheckMinutes * 60 * 1000);","}"]},"shop:src/notify.js":{"sha":"c7c72dcf0afd580f25d145d28106b8fecdf282ac","lines":["import { config } from './config.js';","import { db } from './db.js';","import { subscribe } from './events.js';","","export const outbox = [];","","function mail(customerId, subject) {","  const customer = db.customers.get(customerId);","  if (customer?.email) outbox.push({ to: customer.email, subject });","}","","subscribe('order.created', (order) => {","  if (order.delivery > 0) mail(order.customerId, `Add ${config.freeDeliveryFrom - order.subtotal} more to order ${order.id} for free delivery`);","});","subscribe('order.shipped', (order) => mail(order.customerId, `Order ${order.id} is on its way`));","subscribe('order.refunded', (order) => mail(order.customerId, `Order ${order.id} was cancelled`));","subscribe('refund.issued', (record) => mail(record.customerId, `A refund of ${record.amount} was issued`));"]},"shop:config/production.json":{"sha":"c7c72dcf0afd580f25d145d28106b8fecdf282ac","lines":["{","  \"deliveryBase\": 590,","  \"maxDelivery\": 3000,","  \"freeDeliveryFrom\": 7500,","  \"unshippedCheckMinutes\": 15","}"]},"shop:src/server.js":{"sha":"c7c72dcf0afd580f25d145d28106b8fecdf282ac","lines":["import { createServer } from 'node:http';","import { cancel, createOrder, deliver, pay, ship } from './orders.js';","import { refundsOf } from './payments.js';","import { startUnshippedJob } from './jobs/unshipped.js';","import './notify.js';","","const actions = { pay, ship, deliver, cancel };","","function send(res, status, body) {","  res.writeHead(status, { 'content-type': 'application/json' });","  res.end(JSON.stringify(body));","}","","async function readJson(req) {","  let raw = '';","  for await (const chunk of req) raw += chunk;","  return raw ? JSON.parse(raw) : {};","}","","export const server = createServer(async (req, res) => {","  try {","    const url = new URL(req.url, 'http://localhost');","    if (req.method === 'POST' && url.pathname === '/orders') {","      const { customerId, items } = await readJson(req);","      return send(res, 201, createOrder(customerId, items));","    }","    const action = url.pathname.match(/^\\/orders\\/([\\w-]+)\\/(pay|ship|deliver|cancel)$/);","    if (req.method === 'POST' && action) {","      return send(res, 200, actions[action[2]](action[1]));","    }","    const refunds = url.pathname.match(/^\\/customers\\/([\\w-]+)\\/refunds$/);","    if (req.method === 'GET' && refunds) {","      return send(res, 200, refundsOf(refunds[1]));","    }","    return send(res, 404, { error: 'not found' });","  } catch (err) {","    return send(res, 409, { error: err.message });","  }","});","","if (process.argv[1] === new URL(import.meta.url).pathname) {","  startUnshippedJob();","  server.listen(process.env.PORT || 3000);","}"]},"shop:src/payments.js":{"sha":"c7c72dcf0afd580f25d145d28106b8fecdf282ac","lines":["import { db } from './db.js';","import { publish } from './events.js';","","export function refund(order, amount) {","  if (amount \u003c= 0) return null;","  const record = { orderId: order.id, customerId: order.customerId, amount };","  db.refunds.push(record);","  publish('refund.issued', record);","  return record;","}","","export function refundsOf(customerId) {","  return db.refunds.filter((record) => record.customerId === customerId);","}"]},"shop:src/events.js":{"sha":"c7c72dcf0afd580f25d145d28106b8fecdf282ac","lines":["const handlers = new Map();","","export function subscribe(topic, handler) {","  if (!handlers.has(topic)) handlers.set(topic, []);","  handlers.get(topic).push(handler);","}","","export function publish(topic, payload) {","  for (const handler of handlers.get(topic) ?? []) handler(payload);","}"]},"shop:src/db.js":{"sha":"c7c72dcf0afd580f25d145d28106b8fecdf282ac","lines":["// An in-memory store; a real deployment swaps it for a database with the same tables.","export const db = {","  customers: new Map(),","  orders: new Map(),","  refunds: [],","};","","let nextId = 1;","","export function newId(prefix) {","  return `${prefix}-${nextId++}`;","}"]},"shop:src/config.js":{"sha":"c7c72dcf0afd580f25d145d28106b8fecdf282ac","lines":["import { readFileSync } from 'node:fs';","","const env = process.env.APP_ENV || 'development';","","function load(name) {","  try {","    return JSON.parse(readFileSync(new URL(`../config/${name}.json`, import.meta.url), 'utf8'));","  } catch {","    return {};","  }","}","","export const config = { ...load('default'), ...load(env) };"]},"shop@base:src/orders.js":{"sha":"6750b27dc6159ecd55c0be8d2150175d8c19285e","lines":["import { db, newId } from './db.js';","import { publish } from './events.js';","import { config } from './config.js';","import { refund } from './payments.js';","","const DAY = 24 * 60 * 60 * 1000;","","export const STATUS = {","  created: 'created',","  paid: 'paid',","  shipped: 'shipped',","  delivered: 'delivered',","  refunded: 'refunded',","};","","export function createOrder(customerId, items, now = Date.now()) {","  if (!db.customers.has(customerId)) throw new Error('unknown customer');","  if (!items?.length) throw new Error('empty order');","  const subtotal = items.reduce((sum, item) => sum + item.price * item.qty, 0);","  const weightKg = items.reduce((sum, item) => sum + item.weightKg * item.qty, 0);","  const order = { id: newId('order'), customerId, items, subtotal, weightKg, status: STATUS.created, createdAt: now };","  order.delivery = deliveryCost(order);","  order.total = order.subtotal + order.delivery;","  db.orders.set(order.id, order);","  publish('order.created', order);","  return order;","}","","export function deliveryCost(order) {","  const kg = Math.ceil(order.weightKg);","  const cost = config.deliveryBase + kg * config.deliveryPerKg;","  return Math.min(cost, config.maxDelivery);","}","","function advance(orderId, from, to, now) {","  const order = db.orders.get(orderId);","  if (!order) throw new Error('unknown order');","  if (order.status !== from) throw new Error(`order is ${order.status}, not ${from}`);","  order.status = to;","  order[`${to}At`] = now;","  publish(`order.${to}`, order);","  return order;","}","","export function pay(orderId, now = Date.now()) {","  return advance(orderId, STATUS.created, STATUS.paid, now);","}","","export function ship(orderId, now = Date.now()) {","  return advance(orderId, STATUS.paid, STATUS.shipped, now);","}","","export function deliver(orderId, now = Date.now()) {","  return advance(orderId, STATUS.shipped, STATUS.delivered, now);","}","","export function cancel(orderId, now = Date.now()) {","  const order = advance(orderId, STATUS.paid, STATUS.refunded, now);","  refund(order, order.total);","  return order;","}","","export function refundUnshipped(now = Date.now()) {","  const changed = [];","  for (const order of db.orders.values()) {","    if (order.status === STATUS.paid && now > order.paidAt + config.shipWithinDays * DAY) {","      changed.push(cancel(order.id, now));","    }","  }","  return changed;","}"]},"shop:test/orders.test.js":{"sha":"c7c72dcf0afd580f25d145d28106b8fecdf282ac","lines":["import { test } from 'node:test';","import assert from 'node:assert/strict';","import { db } from '../src/db.js';","import { createOrder, pay, refundUnshipped, STATUS } from '../src/orders.js';","import { outbox } from '../src/notify.js';","","const DAY = 24 * 60 * 60 * 1000;","","db.customers.set('c-1', { id: 'c-1', email: 'buyer@example.com' });","","test('delivery is charged per started kilogram', () => {","  const order = createOrder('c-1', [{ price: 1200, qty: 2, weightKg: 1.1 }], 0);","  assert.equal(order.delivery, 490 + 3 * 150);","  assert.equal(order.total, 2400 + 940);","});","","test('delivery is capped at maxDelivery', () => {","  const order = createOrder('c-1', [{ price: 900, qty: 1, weightKg: 40 }], 0);","  assert.equal(order.delivery, 2500);","});","","test('a paid order not shipped in time is refunded', () => {","  const order = createOrder('c-1', [{ price: 1500, qty: 1, weightKg: 0.5 }], 0);","  pay(order.id, 0);","  refundUnshipped(4 * DAY);","  assert.equal(order.status, STATUS.refunded);","  assert.equal(db.refunds.at(-1).amount, order.total);","});","","test('an order from freeDeliveryFrom ships free', () => {","  const order = createOrder('c-1', [{ price: 2500, qty: 2, weightKg: 3 }], 0);","  assert.equal(order.delivery, 0);","  assert.equal(order.total, 5000);","});","","test('below the threshold the customer is told how much more makes delivery free', () => {","  const order = createOrder('c-1', [{ price: 4999, qty: 1, weightKg: 1 }], 0);","  assert.equal(order.delivery, 490 + 150);","  assert.equal(outbox.at(-1).subject, `Add 1 more to order ${order.id} for free delivery`);","});"]}},"engine":{"version":"1.0.0"},"validation":{"anchors":185,"inferred":9}}</script>

(function () {
  'use strict';

  var drawerOpener = null;
  var armed = null;

  function fileOf(anchor) {
    return anchor && vs.page.code && vs.page.code[anchor.repo + ':' + anchor.path];
  }

  }

  function where(anchor) {

    return vs.t(spans.length > 1 || spans[0][1] > spans[0][0] ? 'anchors.lines' : 'anchors.line', { lines: lineLabel(anchor) });
  }

  function copyText(anchor) {

  }

  function shaOf(anchor) {

        vs.el('span', { class: 'vs-code-num' }, String(n)),

  function openDrawer(anchor, opener) {

    var close = vs.el('button', { type: 'button', class: 'vs-iconbtn', title: vs.t('anchors.close'), 'aria-label': vs.t('anchors.close'), onclick: closeDrawer }, vs.icon('x', 15));

            vs.el('span', { class: 'vs-drawer-meta' }, anchor.repo + '@' + shaOf(anchor) + ' · ' + where(anchor)),

      ]),

    drawer.hidden = false;

    var spans = spansOf(anchor);

      var hovered = null;

        if (e.relatedTarget) return;

        arm(null);
      });
    },

<script>
verstat.register("commits", (() => {
const LANE = 18;
const NODE_Y = 20;

function newestFirst(list) {
  const at = new Map(list.map((c, i) => [c.sha, i]));
  const linked = list.some((c) => (c.parents || []).some((p) => at.has(p)));
  const oldestFirst = list.some((c, i) => (c.parents || []).some((p) => at.has(p) && at.get(p) < i));

function verstatRender(block, ctx) {

  const lane = (n) => `stroke:var(--vs-lane-${n})`;

  const baseName = brief ? ctx.t('commits.fromBase', { base: brief.pr.base }) : ctx.t('commits.fromBaseBranch');
  let selected = null;
  const rows = [];

  function select(commit) {

      row.node.setAttribute('aria-pressed', on ? 'true' : 'false');
      row.dot.classList.toggle('vs-cm-dot-on', on);

        ? `M${xc} 0 V ${NODE_Y}`

    for (const k of g.outs) {

      class: `vs-cm-dot${merge || c.external ? ' vs-cm-dot-hollow' : ''}${c.external ? ' vs-cm-dot-external' : ''}`,

.vs-dt-none { color: var(--vs-accent-ink); font-family: var(--vs-mono); font-size: 12px; }
.vs-dt-out { display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.4; }
.vs-dt-warn { font-size: 12.5px; padding-top: 0; font-family: var(--vs-font); white-space: normal; align-items: baseline; }

if (typeof document !== 'undefined' && !document.querySelector('style[data-vs-type="decision-table"]')) {

  style.setAttribute('data-vs-type', 'decision-table');
  style.textContent = CSS;
  document.head.appendChild(style);

verstat.behavior = verstat.behavior || {};

  conflicts(conditions, rows) {

    const pairs = [];
    for (let i = 0; i < rows.length; i++) {
      for (let j = i + 1; j < rows.length; j++) {
        const a = rows[i];
        const b = rows[j];
        if (!filled(a.outcome) || !filled(b.outcome) || a.outcome === b.outcome) continue;
        const overlap = conditions.every((c) => {
          const x = (a.when || {})[c.id];
          const y = (b.when || {})[c.id];
          if (!filled(x) || !filled(y)) return false;
          return x === '*' || y === '*' || x === y;
        });
        if (overlap) pairs.push([a.id, b.id]);

function verstatRender(block, ctx) {
  const { el, diff } = ctx;
  const visible = block.rows.filter((r) => diff.shows(r));
  if (!visible.length) return null;
  const conds = block.conditions;
  const oldBasis = (r) => {
    if (diff.mode !== 'before' || r.change !== 'changed' || !r.before) return null;
    if (r.before.anchor) return 'checked';
    return r.before.literal !== undefined && r.before.literal !== r.literal ? 'unanchored' : null;
  };
  const rows = visible.map((r) => ({
    part: r,
    id: r.id,
    when: diff.mode === 'before' && r.change === 'changed' && r.before && r.before.when ? Object.assign({}, r.when, r.before.when) : r.when,
    outcome: diff.value(r, 'outcome'),
    anchor: oldBasis(r) === 'unanchored' ? undefined : diff.value(r, 'anchor'),
    source: { checked: (r.before && r.before.source) || r.source, unanchored: 'inferred' }[oldBasis(r)] || (oldBasis(r) ? undefined : r.source),
  }));
  const number = new Map(rows.map((r, i) => [r.id, i + 1]));
  const against = new Map();
  const live = diff.mode === 'diff' ? rows.filter((r) => r.part.change !== 'removed') : rows;
  for (const [a, b] of verstat.behavior.decisionTable.conflicts(conds, live)) {

    against.set(b, (against.get(b) || []).concat(a));

  const minWidth = 28 + conds.length * 126 + 176 + 166;

  const was = (r, value, old) => (inDiff && r.part.change === 'changed' && old !== undefined && old !== value
    ? el('span', { class: 'vs-dt-was' }, old === '' ? '∅' : old) : null);

  const header = el('div', { class: 'vs-table-row vs-table-head' }, [
    el('span', {}, inDiff ? '±' : '#'),
    ...conds.map((c) => ctx.part(el('span', {}, c.label), c.id)),
    el('span', {}, block.outcomeLabel || ctx.t('decision-table.outcome')),
    el('span', { class: 'vs-table-code' }, ctx.t('decision-table.code')),
  ]);

  const body = rows.map((r, i) => {
    const before = (r.part.before && r.part.before.when) || {};
    const cells = conds.map((c) => {
      const v = r.when[c.id];
      if (typeof v !== 'string' || v === '') {
        return el('div', { class: 'vs-dt-cell' }, [was(r, '', before[c.id]), el('span', { class: 'vs-dt-empty', title: ctx.t('decision-table.emptyTitle') }, ctx.t('decision-table.empty'))]);
      }
      return el('div', { class: `vs-dt-cell${v === '*' ? ' vs-dt-any' : ''}` }, [was(r, v, before[c.id]), v === '*' ? ctx.t('decision-table.any') : v]);
    });
    const conflict = against.get(r.id);
    const outcome = el('div', { class: 'vs-dt-out' }, [
      el('span', {}, [
        was(r, r.outcome, r.part.before && r.part.before.outcome),
        r.outcome ? r.outcome : el('span', { class: 'vs-dt-none' }, ctx.t('decision-table.undefined')),
      ]),
      conflict ? el('span', { class: 'vs-state vs-state-problem vs-dt-warn' }, ctx.plural(conflict.length, 'decision-table.conflict', { rows: conflict.map((id) => number.get(id)).join(', ') })) : null,
      r.part.note ? el('span', { class: 'vs-dt-note' }, r.part.note) : null,
    ]);
    const chips = [];
    if (r.anchor) chips.push(ctx.anchorChip(r.anchor));
    if (r.source) chips.push(ctx.sourceChip(r.source));
    const code = el('div', { class: 'vs-table-code', 'data-no-terms': true }, chips.length ? el('div', { class: 'vs-chips' }, chips) : null);
    const marks = { added: '+', removed: '−', changed: '~' };
    const mark = `${inDiff ? (marks[r.part.change] || '') : ''}${i + 1}`;

<script>
verstat.register("dependency-graph", (() => {
if (typeof document !== 'undefined' && !document.querySelector('style[data-vs-type="dependency-graph"]')) {
  const style = document.createElement('style');
  style.setAttribute('data-vs-type', 'dependency-graph');
  style.textContent = `
.vs-dg { display: flex; flex-direction: column; gap: 10px; }
.vs-dg-caption { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--vs-muted); }
.vs-dg-caption b { color: var(--vs-ink); font-weight: 600; }
.vs-dg-caption .vs-dg-cyc { color: var(--vs-accent-ink); }
.vs-dg-muted { color: var(--vs-muted); }
.vs-dg-edges { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.vs-dg-edges li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.vs-dg-edges .vs-dg-to { font-family: var(--vs-mono); font-size: 12px; overflow-wrap: anywhere; }
`;
  document.head.appendChild(style);
}

function cycles(nodes, edges) {
  const adj = new Map(nodes.map((n) => [n.id, []]));
  edges.forEach((e) => { if (adj.has(e.from) && adj.has(e.to)) adj.get(e.from).push(e.to); });
  let index = 0;
  const idx = new Map();
  const low = new Map();
  const stack = [];
  const onStack = new Set();
  const comps = [];
  const strong = (v) => {
    idx.set(v, index);
    low.set(v, index);
    index++;
    stack.push(v);
    onStack.add(v);
    for (const w of adj.get(v)) {
      if (!idx.has(w)) {
        strong(w);
        low.set(v, Math.min(low.get(v), low.get(w)));
      } else if (onStack.has(w)) {
        low.set(v, Math.min(low.get(v), idx.get(w)));
      }
    }
    if (low.get(v) === idx.get(v)) {
      const comp = [];
      let w;
      do {
        w = stack.pop();
        onStack.delete(w);
        comp.push(w);
      } while (w !== v);
      comps.push(comp);
    }
  };
  adj.forEach((_, id) => { if (!idx.has(id)) strong(id); });
  const selfLoops = new Set(edges.filter((e) => e.from === e.to && adj.has(e.from)).map((e) => e.from));
  const components = comps.filter((c) => c.length > 1 || selfLoops.has(c[0]));
  const compOf = new Map();
  components.forEach((c, i) => c.forEach((id) => compOf.set(id, i)));
  return {
    components,
    edges: edges.map((e) => compOf.has(e.from) && compOf.get(e.from) === compOf.get(e.to)),
  };
}

function render(block, ctx) {
  const { el } = ctx;
  const nodes = block.nodes || [];
  if (!nodes.length) return null;
  const warn = (text) => { if (typeof console !== 'undefined') console.warn('verstat: dependency-graph "' + block.id + '": ' + text); };
  const known = new Set(nodes.map((n) => n.id));
  const edges = (block.edges || []).filter((e) => {
    if (known.has(e.from) && known.has(e.to)) return true;
    warn('edge ' + e.from + ' → ' + e.to + ' names an unknown node; not drawn');
    return false;
  });
  const cyc = cycles(nodes, edges);
  const clusters = (block.clusters || []).filter((c) => nodes.some((n) => n.cluster === c.id));
  const clusterById = new Map(clusters.map((c) => [c.id, c]));
  const declared = new Set((block.clusters || []).map((c) => c.id));
  nodes.forEach((n) => { if (n.cluster && !declared.has(n.cluster)) warn('node "' + n.id + '" names an unknown cluster "' + n.cluster + '"; drawn without a frame'); });

  const detail = el('div', { class: 'vs-flow-panel', 'aria-live': 'polite', 'data-no-terms': true });
  const hint = () => detail.replaceChildren(el('div', { class: 'vs-flow-hint-row' }, ctx.t('dependency-graph.hint')));
  hint();

  const byId = new Map(nodes.map((n) => [n.id, n]));
  const edgeRow = (e, out) => el('li', {}, [
    el('span', { class: 'vs-dg-to' }, (out ? '→ ' : '← ') + byId.get(out ? e.to : e.from).label),
    el('span', { class: 'vs-dg-muted' }, [ctx.t(`dependency-graph.edge.${e.kind || 'import'}`, null, e.kind), e.label].filter(Boolean).join(' · ')),
    e.anchor ? ctx.anchorChip(e.anchor) : null,
    ctx.sourceChip(e.source),
  ]);
  const cell = (label, value) => el('div', {}, [el('span', { class: 'vs-flow-k' }, label), ...[].concat(value)]);

  const select = (n) => {
    const ins = edges.filter((e) => e.to === n.id);
    const outs = edges.filter((e) => e.from === n.id);
    const chips = (n.anchors || []).map((a) => ctx.anchorChip(a));
    if (n.source) chips.push(ctx.sourceChip(n.source));
    const cluster = clusterById.get(n.cluster);
    detail.replaceChildren(...[
      cell(ctx.t('dependency-graph.module'), [
        el('span', { class: 'vs-flow-v vs-flow-strong' }, n.label),
        el('span', { class: 'vs-dg-muted' }, (cluster ? cluster.label + ' · ' : '') + ctx.t('dependency-graph.inOut', { in: ins.length, out: outs.length })),
      ]),
      n.note ? cell(ctx.t('dependency-graph.note'), el('span', { class: 'vs-flow-v' }, n.note)) : null,
      chips.length ? cell(ctx.t('dependency-graph.code'), el('div', { class: 'vs-chips' }, chips)) : null,
      ins.length || outs.length
        ? cell(ctx.t('dependency-graph.deps'), el('ul', { class: 'vs-dg-edges' }, outs.map((e) => edgeRow(e, true)).concat(ins.map((e) => edgeRow(e, false)))))
        : null,
    ].filter(Boolean));
  };

  const hover = (n) => {
    ctx.emit('dependency-graph:hover', n
      ? { block: block.id, node: n.id, label: n.label, cluster: n.cluster || null, paths: (n.anchors || []).map((a) => a.path) }
      : { block: block.id, node: null, label: null, cluster: null, paths: [] });
  };

  const host = el('div', {});
  const flow = verstat.flow.mount(host, {
    spec: {
      rankdir: 'TB',
      groups: clusters.map((c) => ({ id: c.id, title: c.label })),
      nodes: nodes.map((n) => ({
        id: n.id,
        title: n.label,
        note: n.note,
        group: clusterById.has(n.cluster) ? n.cluster : undefined,
        hot: !!n.highlight,
        dash: ctx.isInferred(n),
        click: true,
      })),
      edges: edges.map((e, i) => ({
        part: e.id || null,
        s: e.from,
        t: e.to,
        label: e.label,
        on: cyc.edges[i],
        dash: e.kind === 'call' || ctx.isInferred(e),
      })),
    },
    height: 460,
    ariaLabel: block.title || ctx.t('dependency-graph.label'),
    onNodeEnter: (id) => { flow.update({ hl: [id] }); hover(byId.get(id)); },
    onNodeLeave: () => { flow.update({ hl: [] }); hover(null); },
    onNodeClick: (id) => {
      const n = byId.get(id);
      select(n);
      if (n.anchors && n.anchors.length) verstat.anchors.open(n.anchors[0]);
    },
  });
  ctx.onCleanup(() => flow.destroy());

  ctx.on('focus', (d) => { if (d.block !== block.id || !d.part) flow.update({ focus: null }); });
  ctx.onFocus((id) => {
    flow.update({ focus: id });
    const n = byId.get(id);
    if (n) select(n);
  });

  const imports = edges.filter((e) => e.kind !== 'call').length;
  const calls = edges.length - imports;
  return el('div', { class: 'vs-dg' }, [
    el('div', { class: 'vs-flow-frame' }, [host, detail]),
    el('div', { class: 'vs-dg-caption' }, [
      el('span', {}, [el('b', {}, ctx.plural(nodes.length, 'dependency-graph.modules'))]),
      el('span', {}, ctx.t('dependency-graph.legend', { imports, calls })),
      el('span', { class: cyc.components.length ? 'vs-dg-cyc' : null }, ctx.t('dependency-graph.cycles', { n: cyc.components.length })),
    ]),
  ]);
}

render.cycles = cycles;

;return render;
})(), {"group":"structure","label":"Dependency graph","diffMode":false});
</script>
<script>
verstat.register("doc-changes", (() => {
const MARK = { '+': '+', '-': '−', ' ': '' };

function adrName(name) {
  const adr = name.match(/^(\d{4})-/);
  return adr ? `ADR ${adr[1]}` : name;
}

function span(numbers) {
  if (!numbers.length) return '';
  const lo = Math.min(...numbers);
  const hi = Math.max(...numbers);
  return lo === hi ? String(lo) : `${lo}–${hi}`;
}

function sameCommit(a, b) {
  return !!a && !!b && (a.startsWith(b) || b.startsWith(a));
}

function verstatRender(block, ctx) {
  const { el } = ctx;
  const files = block.files.filter((f) => f.diff);
  if (!files.length) return null;
  const names = ctx.pathLabels(files.map((f) => f.path), adrName);
  const md = window.verstat.markdown;
  let filter = null;
  const tabs = new Map();
  const cards = [];
  const opens = new Map();
  const views = new Map();

  function inline(text) {
    return md.inline(text || '').map((run) => {
      let node = run.code ? el('code', { class: 'vs-md-code' }, run.t) : document.createTextNode(run.t);
      if (run.i) node = el('em', {}, node);
      if (run.b) node = el('strong', {}, node);
      if (run.href) node = el('a', { href: run.href, target: '_blank', rel: 'noopener noreferrer' }, node);
      return node;
    });
  }

  function mark(sign) {
    return el('span', { class: `vs-md-mark vs-md-mark-${sign === '+' ? 'add' : 'del'}`, 'aria-hidden': 'true' }, MARK[sign]);
  }

  function signClass(sign) {
    return sign === '+' ? ' vs-md-add' : sign === '-' ? ' vs-md-del' : '';
  }

  function row(line, sign, body, extra) {
    return el('div', { class: `vs-md-row${extra || ''}` }, [
      el('span', { class: 'vs-md-ln' }, line === undefined ? '' : String(line)),
      el('span', { class: 'vs-md-sign' }, sign === ' ' ? '' : mark(sign)),
      body,
    ]);
  }

  function blockNode(item) {
    if (item.type === 'code') {
      return item.rows.map((r) => row(r.line, r.sign, el('div', { class: `vs-md-block vs-md-pre${signClass(r.sign)}`, 'data-no-terms': true }, r.text || ' ')));
    }
    if (item.type === 'table') {
      const cols = Math.max(...item.rows.map((r) => r.cells.length));
      const table = el('div', { class: 'vs-md-table', style: `grid-template-columns:repeat(${cols}, auto)` }, item.rows.flatMap((r) =>
        Array.from({ length: cols }, (_, c) => el('div', {
          class: `vs-md-cell${r.head ? ' vs-md-th' : ''}${signClass(r.sign)}`,
        }, [c === 0 && r.sign !== ' ' ? mark(r.sign) : null, ...inline(r.cells[c] || '')]))));
      const changed = item.rows.filter((r) => r.sign !== ' ');
      return [row(changed.length ? changed[0].line : item.start, ' ', el('div', { class: 'vs-md-block vs-md-tablewrap' }, table))];
    }
    const cls = `vs-md-block vs-md-${item.type}${signClass(item.sign)}${item.section ? ' vs-md-section' : ''}`;
    let body;
    if (item.type === 'hr') body = el('div', { class: cls }, el('hr'));
    else if (item.type === 'li' || item.type === 'oli') {
      body = el('div', { class: cls, style: item.depth ? `margin-left:${item.depth * 18}px` : null }, [
        el('span', { class: 'vs-md-bullet' }, item.type === 'li' ? '•' : `${item.num}.`),
        el('span', {}, inline(item.text)),
      ]);
    } else if (item.type === 'quote') {
      body = el('div', { class: cls }, [el('span', { class: 'vs-md-bullet' }, '›'), el('span', {}, inline(item.text))]);
    } else body = el('div', { class: cls }, inline(item.text));
    return [row(item.line, item.sign, body)];
  }

  function formatted(items) {
    return el('div', { class: 'vs-md' }, items.flatMap(blockNode));
  }

  function raw(hunk) {
    return el('div', { class: 'vs-md-raw', 'data-no-terms': true }, hunk.lines.map((l) => {
      const sign = l.kind === 'add' ? '+' : l.kind === 'del' ? '-' : ' ';
      return el('div', { class: `vs-md-rawline${signClass(sign)}` }, [
        el('span', { class: 'vs-md-ln' }, l.old === undefined ? '' : String(l.old)),
        el('span', { class: 'vs-md-ln' }, l.new === undefined ? '' : String(l.new)),
        el('span', { class: 'vs-md-sign' }, sign === ' ' ? '' : mark(sign)),
        el('span', { class: 'vs-md-rawtext' }, l.text),
      ]);
    }));
  }

  function hunkTitle(file, items) {
    if (!items) return names.get(file.path);
    const heading = items.find((i) => /^h[1-4]$/.test(i.type));
    return heading ? heading.text.replace(/[`*_]/g, '') : names.get(file.path);
  }

  function card(file, hunk, k) {
    const fragment = (file.fragments || []).find((fr) => fr.hunk === k) || null;
    const kind = fragment ? fragment.kind : 'skim';
    const added = hunk.lines.filter((l) => l.kind === 'add');
    const removed = hunk.lines.filter((l) => l.kind === 'del');
    const range = added.length ? span(added.map((l) => l.new)) : ctx.t('doc-changes.was', { lines: span(removed.map((l) => l.old)) });
    const canFormat = !file.diff.large && !!(file.diff.old || file.diff.new);
    const items = canFormat ? md.fragment(file.diff.old, file.diff.new, hunk.lines) : null;
    const shows = !!items && items.some((i) => i.sign !== ' ');
    let isRaw = !shows;
    const content = el('div', { class: 'vs-dc-content' });
    const fmtBtn = el('button', { type: 'button', class: 'vs-dc-view', onclick: () => show(false) }, ctx.t('doc-changes.formatted'));
    const rawBtn = el('button', { type: 'button', class: 'vs-dc-view', onclick: () => show(true) }, 'raw diff');
    function show(asRaw) {
      isRaw = asRaw;
      fmtBtn.setAttribute('aria-pressed', asRaw ? 'false' : 'true');
      rawBtn.setAttribute('aria-pressed', asRaw ? 'true' : 'false');
      content.replaceChildren(asRaw ? raw(hunk) : formatted(items));
    }
    const body = el('div', { class: 'vs-dc-body' }, [
      canFormat ? el('div', { class: 'vs-dc-views', role: 'group', 'aria-label': ctx.t('doc-changes.view') }, [fmtBtn, rawBtn]) : el('p', { class: 'vs-dc-notice' }, ctx.t('doc-changes.tooLarge')),
      content,
    ]);
    show(isRaw);
    const sign = el('span', { class: 'vs-dc-chev', 'aria-hidden': 'true' });
    const head = el('button', { type: 'button', class: 'vs-dc-head', 'aria-expanded': 'false', onclick: () => toggle(body.hidden) }, [
      el('span', { class: 'vs-dc-range' }, range),
      el('span', { class: `vs-dc-kind vs-dc-kind-${kind}` }, ctx.t(`doc-changes.kind.${kind}`, null, kind)),
      el('span', { class: 'vs-dc-title' }, [
        el('span', { class: 'vs-dc-name' }, fragment ? fragment.title : hunkTitle(file, items)),
        el('span', { class: 'vs-dc-desc' }, [
          fragment && fragment.summary ? `${fragment.summary} · ` : '',
          el('span', { class: 'vs-dc-file' }, file.path.split('/').pop()),
        ]),
      ]),
      el('span', { class: 'vs-dc-meta' }, [
        fragment && fragment.commit ? el('span', { class: 'vs-dc-commit' }, fragment.commit.slice(0, 7)) : null,
        el('span', { class: 'vs-add' }, `+${added.length}`),
        el('span', { class: 'vs-del' }, `−${removed.length}`),
        sign,
      ]),
    ]);
    function toggle(open) {
      body.hidden = !open;
      head.setAttribute('aria-expanded', open ? 'true' : 'false');
      sign.textContent = open ? '−' : '+';
    }
    toggle(kind === 'read');
    const node = el('div', { class: 'vs-dc-card' }, [head, body]);
    cards.push({ node, file, fragment });
    if (fragment) {
      opens.set(fragment.id, () => {
        pick(file);
        toggle(true);
        node.classList.add('vs-focus');
        node.scrollIntoView({ block: 'nearest' });
      });
      return ctx.part(node, fragment.id);
    }
    return node;
  }

  const list = el('div', { class: 'vs-dc-list' });
  const summary = el('p', { class: 'vs-dc-summary' });
  function pick(file) {

verstat.register("test-coverage", (() => {
