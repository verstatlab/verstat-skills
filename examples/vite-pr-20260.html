<style>
.vs-cm { display: flex; flex-direction: column; border-top: var(--vs-rw) solid var(--vs-rule-strong); }
.vs-cm-row {
  display: flex;
  align-items: stretch;
  width: 100%;
  padding: 0;
  background: transparent;
  color: var(--vs-ink);
  border: none;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.vs-cm-graph { position: relative; flex: none; align-self: stretch; }
.vs-cm-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
.vs-cm-line { fill: none; stroke-width: 2; }
.vs-cm-dot { fill: var(--vs-cm-lane); stroke-width: 2; }
.vs-cm-dot-hollow { fill: var(--vs-bg); }
.vs-cm-dot-external { stroke-dasharray: 2 2; }
.vs-cm-dot.vs-cm-dot-on { fill: var(--vs-accent); stroke: var(--vs-accent) !important; stroke-dasharray: none; }
.vs-cm-body {
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: 76px 150px 1fr auto;
  gap: 12px;
  align-items: baseline;
  margin-left: 12px;
  padding: 11px 8px;
  border-bottom: 1px solid var(--vs-rule);
}
.vs-cm-norepo .vs-cm-body { grid-template-columns: 76px 1fr auto; }
.vs-cm-row:hover .vs-cm-body { background: color-mix(in oklab, var(--vs-surface) 60%, transparent); }
.vs-cm-row[aria-pressed="true"] .vs-cm-body { background: var(--vs-surface); }
.vs-cm-sha, .vs-cm-repo, .vs-cm-stat { font-family: var(--vs-mono); font-size: 12px; color: var(--vs-muted); }
.vs-cm-repo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vs-cm-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vs-cm-msg { font-family: var(--vs-mono); font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
.vs-cm-external .vs-cm-msg { color: var(--vs-muted); }
.vs-cm-tag {
  display: inline-block;
  margin-left: 8px;
  padding: 0 5px;
  border: 1px solid var(--vs-rule-strong);
  border-radius: 4px;
  font-size: 11px;
  font-weight: 400;
  color: var(--vs-muted);
  vertical-align: 1px;
}
.vs-cm-intent { font-size: 13px; color: var(--vs-muted); }
.vs-cm-stat { white-space: nowrap; }

.vs-acc { border-top: var(--vs-rw) solid var(--vs-rule-strong); }
.vs-acc-item { border-bottom: 1px solid var(--vs-rule); }
.vs-acc-item.vs-focus { outline-offset: -2px; }
.vs-acc-head {
  display: grid;
  grid-template-columns: 96px 1fr auto 20px;
  gap: 12px;
  align-items: baseline;
  width: 100%;
  padding: 12px 0;
  background: transparent;
  color: var(--vs-ink);
  border: none;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.vs-acc-head:hover .vs-acc-title > span:first-child { color: var(--vs-accent-ink); }
.vs-acc-kind { font-family: var(--vs-mono); font-size: 11px; letter-spacing: .04em; color: var(--vs-muted); }
.vs-acc-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 15px; font-weight: 600; }
.vs-acc-path { font-family: var(--vs-mono); font-size: 12px; font-weight: 400; color: var(--vs-muted); overflow-wrap: anywhere; }
.vs-acc-count { font-family: var(--vs-mono); font-size: 12px; color: var(--vs-muted); white-space: nowrap; }
.vs-acc-sign { font-family: var(--vs-mono); font-size: 16px; text-align: center; color: var(--vs-muted); }
.vs-acc-body { padding: 0 0 14px 108px; display: flex; flex-direction: column; gap: 8px; }
.vs-acc-body[hidden] { display: none; }
.vs-acc-note { font-size: 14px; color: var(--vs-muted); }
.vs-acc-pre {
  margin: 0;
  padding: 10px 12px;
  background: var(--vs-code-bg);
  border: 1px solid var(--vs-rule);
  border-radius: var(--vs-r);
  font-family: var(--vs-mono);
  font-size: 12px;
  line-height: 1.6;
  overflow-x: auto;
}
.vs-acc-line { display: block; min-height: 1.6em; white-space: pre; min-width: 100%; width: max-content; }
.vs-acc-add { background: var(--vs-add-soft); }
.vs-acc-del { background: var(--vs-del-soft); }
.vs-acc-mark { display: inline-block; width: 18px; font-weight: 700; }
.vs-acc-path-line { color: var(--vs-muted); font-weight: 600; }

@media (max-width: 720px) {
  .vs-cm-body { grid-template-columns: 64px 1fr auto; row-gap: 4px; gap: 8px; margin-left: 6px; }
  .vs-cm-norepo .vs-cm-body { grid-template-columns: 64px 1fr; }
  .vs-cm-text { grid-column: 1 / -1; grid-row: 2; }
  .vs-acc-head { grid-template-columns: 1fr auto 20px; }
  .vs-acc-kind { grid-column: 1 / -1; }
  .vs-acc-body { padding-left: 0; }
}

.code === 'ERR_NETWORK_IMPORT_DISALLOWED') {","line":38,"endLine":38},"source":"code","change":"added"},{"id":"r-vite","when":{"runner":"Vite SSR (ssrLoadModule)","node":"available"},"outcome":"resolved: Vite passes createNodeImportMeta","literal":"createImportMeta: createNodeImportMeta,","anchor":{"repo":"vite","path":"packages/vite/src/node/ssr/ssrModuleLoader.ts","find":"createImportMeta: createNodeImportMeta,","line":76,"endLine":76},"source":"code","change":"added"}]},{"id":"docs","type":"doc-changes","title":"Documentation","repo":"vite","base":"vite@base","files":[{"id":"d-runtimes","path":"docs/guide/api-environment-runtimes.md","summary":"Both runner examples now pass createImportMeta: createNodeImportMeta.","fragments":[{"id":"d-1","find":"createImportMeta: createNodeImportMeta, // if the module runner runs in Node.js","kind":"read","title":"Module runner example","summary":"The basic example opts into Node import.meta and says when to.","commit":"07256bbb363abc45c1a0738704120338815b0590","hunk":0},{"id":"d-2","find":"import { parentPort } from 'node:worker_threads'","kind":"skim","title":"Worker example imports","summary":"The worker example imports createNodeImportMeta.","commit":"07256bbb363abc45c1a0738704120338815b0590","hunk":1},{"id":"d-3","find":"const runner = new ModuleRunner(","kind":"skim","title":"Worker example option","summary":"The worker runner passes the option.","commit":"07256bbb363abc45c1a0738704120338815b0590","hunk":2}],"diff":{"status":"modified","additions":12,"deletions":2,"old":["# Environment API for Runtimes","",":::warning Experimental","Environment API is experimental. We'll still maintain stability in the APIs between major releases to allow the ecosystem to experiment and build upon them. We plan to stabilize these new APIs (with potential breaking changes) in a future major release once downstream projects have had time to experiment with the new features and validate them.","","Resources:","","- [Feedback discussion](https://github.com/vitejs/vite/discussions/16358) where we are gathering feedback about the new APIs.","- [Environment API PR](https://github.com/vitejs/vite/pull/16471) where the new API were implemented and reviewed.","","Please share your feedback with us.",":::","","## Environment Factories","","Environments factories are intended to be implemented by Environment providers like Cloudflare, and not by end users. Environment factories return a `EnvironmentOptions` for the most common case of using the target runtime for both dev and build environments. The default environment options can also be set so the user doesn't need to do it.","","```ts","function createWorkerdEnvironment(","  userConfig: EnvironmentOptions,","): EnvironmentOptions {","  return mergeConfig(","    {","      resolve: {","        conditions: [","          /*...*/","        ],","      },","      dev: {","        createEnvironment(name, config) {","          return createWorkerdDevEnvironment(name, config, {","            hot: true,","            transport: customHotChannel(),","          })","        },","      },","      build: {","        createEnvironment(name, config) {","          return createWorkerdBuildEnvironment(name, config)","        },","      },","    },","    userConfig,","  )","}","```","","Then the config file can be written as:","","```js","import { createWorkerdEnvironment } from 'vite-environment-workerd'","","export default {","  environments: {","    ssr: createWorkerdEnvironment({","      build: {","        outDir: '/dist/ssr',","      },","    }),","    rsc: createWorkerdEnvironment({","      build: {","        outDir: '/dist/rsc',","      },","    }),","  },","}","```","","and frameworks can use an environment with the workerd runtime to do SSR using:","","```js","const ssrEnvironment = server.environments.ssr","```","","## Creating a New Environment Factory","","A Vite dev server exposes two environments by default: a `client` environment and an `ssr` environment. The client environment is a browser environment by default, and the module runner is implemented by importing the virtual module `/@vite/client` to client apps. The SSR environment runs in the same Node runtime as the Vite server by default and allows application servers to be used to render requests during dev with full HMR support.","","The transformed source code is called a module, and the relationships between the modules processed in each environment are kept in a module graph. The transformed code for these modules is sent to the runtimes associated with each environment to be executed. When a module is evaluated in the runtime, its imported modules will be requested triggering the processing of a section of the module graph.","","A Vite Module Runner allows running any code by processing it with Vite plugins first. It is different from `server.ssrLoadModule` because the runner implementation is decoupled from the server. This allows library and framework authors to implement their layer of communication between the Vite server and the runner. The browser communicates with its corresponding environment using the server Web Socket and through HTTP requests. The Node Module runner can directly do function calls to process modules as it is running in the same process. Other environments could run modules connecting to a JS runtime like workerd, or a Worker Thread as Vitest does.","","One of the goals of this feature is to provide a customizable API to process and run code. Users can create new environment factories using the exposed primitives.","","```ts","import { DevEnvironment, HotChannel } from 'vite'","","function createWorkerdDevEnvironment(","  name: string,","  config: ResolvedConfig,","  context: DevEnvironmentContext",") {","  const connection = /* ... */","  const transport: HotChannel = {","    on: (listener) => { connection.on('message', listener) },","    send: (data) => connection.send(data),","  }","","  const workerdDevEnvironment = new DevEnvironment(name, config, {","    options: {","      resolve: { conditions: ['custom'] },","      ...context.options,","    },","    hot: true,","    transport,","  })","  return workerdDevEnvironment","}","```","","## `ModuleRunner`","","A module runner is instantiated in the target runtime. All APIs in the next section are imported from `vite/module-runner` unless stated otherwise. This export entry point is kept as lightweight as possible, only exporting the minimal needed to create module runners.","","**Type Signature:**","","```ts","export class ModuleRunner {","  constructor(","    public options: ModuleRunnerOptions,","    public evaluator: ModuleEvaluator = new ESModulesEvaluator(),","    private debug?: ModuleRunnerDebugger,","  ) {}","  /**","   * URL to execute.","   * Accepts file path, server path, or id relative to the root.","   */","  public async import\u003cT = any>(url: string): Promise\u003cT>","  /**","   * Clear all caches including HMR listeners.","   */","  public clearCache(): void","  /**","   * Clear all caches, remove all HMR listeners, reset sourcemap support.","   * This method doesn't stop the HMR connection.","   */","  public async close(): Promise\u003cvoid>","  /**","   * Returns `true` if the runner has been closed by calling `close()`.","   */","  public isClosed(): boolean","}","```","","The module evaluator in `ModuleRunner` is responsible for executing the code. Vite exports `ESModulesEvaluator` out of the box, it uses `new AsyncFunction` to evaluate the code. You can provide your own implementation if your JavaScript runtime doesn't support unsafe evaluation.","","Module runner exposes `import` method. When Vite server triggers `full-reload` HMR event, all affected modules will be re-executed. Be aware that Module Runner doesn't update `exports` object when this happens (it overrides it), you would need to run `import` or get the module from `evaluatedModules` again if you rely on having the latest `exports` object.","","**Example Usage:**","","```js","import { ModuleRunner, ESModulesEvaluator } from 'vite/module-runner'","import { transport } from './rpc-implementation.js'","","const moduleRunner = new ModuleRunner(","  {","    transport,","  },","  new ESModulesEvaluator(),",")","","await moduleRunner.import('/src/entry-point.js')","```","","## `ModuleRunnerOptions`","","```ts twoslash","import type {","  InterceptorOptions as InterceptorOptionsRaw,","  ModuleRunnerHmr as ModuleRunnerHmrRaw,","  EvaluatedModules,","} from 'vite/module-runner'","import type { Debug } from '@type-challenges/utils'","","type InterceptorOptions = Debug\u003cInterceptorOptionsRaw>","type ModuleRunnerHmr = Debug\u003cModuleRunnerHmrRaw>","/** see below */","type ModuleRunnerTransport = unknown","","// ---cut---","interface ModuleRunnerOptions {","  /**","   * A set of methods to communicate with the server.","   */","  transport: ModuleRunnerTransport","  /**","   * Configure how source maps are resolved.","   * Prefers `node` if `process.setSourceMapsEnabled` is available.","   * Otherwise it will use `prepareStackTrace` by default which overrides","   * `Error.prepareStackTrace` method.","   * You can provide an object to configure how file contents and","   * source maps are resolved for files that were not processed by Vite.","   */","  sourcemapInterceptor?:","    | false","    | 'node'","    | 'prepareStackTrace'","    | InterceptorOptions","  /**","   * Disable HMR or configure HMR options.","   *","   * @default true","   */","  hmr?: boolean | ModuleRunnerHmr","  /**","   * Custom module cache. If not provided, it creates a separate module","   * cache for each module runner instance.","   */","  evaluatedModules?: EvaluatedModules","}","```","","## `ModuleEvaluator`","","**Type Signature:**","","```ts twoslash","import type { ModuleRunnerContext as ModuleRunnerContextRaw } from 'vite/module-runner'","import type { Debug } from '@type-challenges/utils'","","type ModuleRunnerContext = Debug\u003cModuleRunnerContextRaw>","","// ---cut---","export interface ModuleEvaluator {","  /**","   * Number of prefixed lines in the transformed code.","   */","  startOffset?: number","  /**","   * Evaluate code that was transformed by Vite.","   * @param context Function context","   * @param code Transformed code","   * @param id ID that was used to fetch the module","   */","  runInlinedModule(","    context: ModuleRunnerContext,","    code: string,","    id: string,","  ): Promise\u003cany>","  /**","   * evaluate externalized module.","   * @param file File URL to the external module","   */","  runExternalModule(file: string): Promise\u003cany>","}","```","","Vite exports `ESModulesEvaluator` that implements this interface by default. It uses `new AsyncFunction` to evaluate code, so if the code has inlined source map it should contain an [offset of 2 lines](https://tc39.es/ecma262/#sec-createdynamicfunction) to accommodate for new lines added. This is done automatically by the `ESModulesEvaluator`. Custom evaluators will not add additional lines.","","## `ModuleRunnerTransport`","","**Type Signature:**","","```ts twoslash","import type { ModuleRunnerTransportHandlers } from 'vite/module-runner'","/** an object */","type HotPayload = unknown","// ---cut---","interface ModuleRunnerTransport {","  connect?(handlers: ModuleRunnerTransportHandlers): Promise\u003cvoid> | void","  disconnect?(): Promise\u003cvoid> | void","  send?(data: HotPayload): Promise\u003cvoid> | void","  invoke?(data: HotPayload): Promise\u003c{ result: any } | { error: any }>","  timeout?: number","}","```","","Transport object that communicates with the environment via an RPC or by directly calling the function. When `invoke` method is not implemented, the `send` method and `connect` method is required to be implemented. Vite will construct the `invoke` internally.","","You need to couple it with the `HotChannel` instance on the server like in this example where module runner is created in the worker thread:","","::: code-group","","```js [worker.js]","import { parentPort } from 'node:worker_threads'","import { fileURLToPath } from 'node:url'","import { ESModulesEvaluator, ModuleRunner } from 'vite/module-runner'","","/** @type {import('vite/module-runner').ModuleRunnerTransport} */","const transport = {","  connect({ onMessage, onDisconnection }) {","    parentPort.on('message', onMessage)","    parentPort.on('close', onDisconnection)","  },","  send(data) {","    parentPort.postMessage(data)","  },","}","","const runner = new ModuleRunner(","  {","    transport,","  },","  new ESModulesEvaluator(),",")","```","","```js [server.js]","import { BroadcastChannel } from 'node:worker_threads'","import { createServer, RemoteEnvironmentTransport, DevEnvironment } from 'vite'","","function createWorkerEnvironment(name, config, context) {","  const worker = new Worker('./worker.js')","  const handlerToWorkerListener = new WeakMap()","","  const workerHotChannel = {","    send: (data) => worker.postMessage(data),","    on: (event, handler) => {","      if (event === 'connection') return","","      const listener = (value) => {","        if (value.type === 'custom' && value.event === event) {","          const client = {","            send(payload) {","              worker.postMessage(payload)","            },","          }","          handler(value.data, client)","        }","      }","      handlerToWorkerListener.set(handler, listener)","      worker.on('message', listener)","    },","    off: (event, handler) => {","      if (event === 'connection') return","      const listener = handlerToWorkerListener.get(handler)","      if (listener) {","        worker.off('message', listener)","        handlerToWorkerListener.delete(handler)","      }","    },","  }","","  return new DevEnvironment(name, config, {","    transport: workerHotChannel,","  })","}","","await createServer({","  environments: {","    worker: {","      dev: {","        createEnvironment: createWorkerEnvironment,","      },","    },","  },","})","```","",":::","","A different example using an HTTP request to communicate between the runner and the server:","","```ts","import { ESModulesEvaluator, ModuleRunner } from 'vite/module-runner'","","export const runner = new ModuleRunner(","  {","    transport: {","      async invoke(data) {","        const response = await fetch(`http://my-vite-server/invoke`, {","          method: 'POST',","          body: JSON.stringify(data),","        })","        return response.json()","      },","    },","    hmr: false, // disable HMR as HMR requires transport.connect","  },","  new ESModulesEvaluator(),",")","","await runner.import('/entry.js')","```","","In this case, the `handleInvoke` method in the `NormalizedHotChannel` can be used:","","```ts","const customEnvironment = new DevEnvironment(name, config, context)","","server.onRequest((request: Request) => {","  const url = new URL(request.url)","  if (url.pathname === '/invoke') {","    const payload = (await request.json()) as HotPayload","    const result = customEnvironment.hot.handleInvoke(payload)","    return new Response(JSON.stringify(result))","  }","  return Response.error()","})","```","","But note that for HMR support, `send` and `connect` methods are required. The `send` method is usually called when the custom event is triggered (like, `import.meta.hot.send(\"my-event\")`).","","Vite exports `createServerHotChannel` from the main entry point to support HMR during Vite SSR."],"new":["# Environment API for Runtimes","",":::warning Experimental","Environment API is experimental. We'll still maintain stability in the APIs between major releases to allow the ecosystem to experiment and build upon them. We plan to stabilize these new APIs (with potential breaking changes) in a future major release once downstream projects have had time to experiment with the new features and validate them.","","Resources:","","- [Feedback discussion](https://github.com/vitejs/vite/discussions/16358) where we are gathering feedback about the new APIs.","- [Environment API PR](https://github.com/vitejs/vite/pull/16471) where the new API were implemented and reviewed.","","Please share your feedback with us.",":::","","## Environment Factories","","Environments factories are intended to be implemented by Environment providers like Cloudflare, and not by end users. Environment factories return a `EnvironmentOptions` for the most common case of using the target runtime for both dev and build environments. The default environment options can also be set so the user doesn't need to do it.","","```ts","function createWorkerdEnvironment(","  userConfig: EnvironmentOptions,","): EnvironmentOptions {","  return mergeConfig(","    {","      resolve: {","        conditions: [","          /*...*/","        ],","      },","      dev: {","        createEnvironment(name, config) {","          return createWorkerdDevEnvironment(name, config, {","            hot: true,","            transport: customHotChannel(),","          })","        },","      },","      build: {","        createEnvironment(name, config) {","          return createWorkerdBuildEnvironment(name, config)","        },","      },","    },","    userConfig,","  )","}","```","","Then the config file can be written as:","","```js","import { createWorkerdEnvironment } from 'vite-environment-workerd'","","export default {","  environments: {","    ssr: createWorkerdEnvironment({","      build: {","        outDir: '/dist/ssr',","      },","    }),","    rsc: createWorkerdEnvironment({","      build: {","        outDir: '/dist/rsc',","      },","    }),","  },","}","```","","and frameworks can use an environment with the workerd runtime to do SSR using:","","```js","const ssrEnvironment = server.environments.ssr","```","","## Creating a New Environment Factory","","A Vite dev server exposes two environments by default: a `client` environment and an `ssr` environment. The client environment is a browser environment by default, and the module runner is implemented by importing the virtual module `/@vite/client` to client apps. The SSR environment runs in the same Node runtime as the Vite server by default and allows application servers to be used to render requests during dev with full HMR support.","","The transformed source code is called a module, and the relationships between the modules processed in each environment are kept in a module graph. The transformed code for these modules is sent to the runtimes associated with each environment to be executed. When a module is evaluated in the runtime, its imported modules will be requested triggering the processing of a section of the module graph.","","A Vite Module Runner allows running any code by processing it with Vite plugins first. It is different from `server.ssrLoadModule` because the runner implementation is decoupled from the server. This allows library and framework authors to implement their layer of communication between the Vite server and the runner. The browser communicates with its corresponding environment using the server Web Socket and through HTTP requests. The Node Module runner can directly do function calls to process modules as it is running in the same process. Other environments could run modules connecting to a JS runtime like workerd, or a Worker Thread as Vitest does.","","One of the goals of this feature is to provide a customizable API to process and run code. Users can create new environment factories using the exposed primitives.","","```ts","import { DevEnvironment, HotChannel } from 'vite'","","function createWorkerdDevEnvironment(","  name: string,","  config: ResolvedConfig,","  context: DevEnvironmentContext",") {","  const connection = /* ... */","  const transport: HotChannel = {","    on: (listener) => { connection.on('message', listener) },","    send: (data) => connection.send(data),","  }","","  const workerdDevEnvironment = new DevEnvironment(name, config, {","    options: {","      resolve: { conditions: ['custom'] },","      ...context.options,","    },","    hot: true,","    transport,","  })","  return workerdDevEnvironment","}","```","","## `ModuleRunner`","","A module runner is instantiated in the target runtime. All APIs in the next section are imported from `vite/module-runner` unless stated otherwise. This export entry point is kept as lightweight as possible, only exporting the minimal needed to create module runners.","","**Type Signature:**","","```ts","export class ModuleRunner {","  constructor(","    public options: ModuleRunnerOptions,","    public evaluator: ModuleEvaluator = new ESModulesEvaluator(),","    private debug?: ModuleRunnerDebugger,","  ) {}","  /**","   * URL to execute.","   * Accepts file path, server path, or id relative to the root.","   */","  public async import\u003cT = any>(url: string): Promise\u003cT>","  /**","   * Clear all caches including HMR listeners.","   */","  public clearCache(): void","  /**","   * Clear all caches, remove all HMR listeners, reset sourcemap support.","   * This method doesn't stop the HMR connection.","   */","  public async close(): Promise\u003cvoid>","  /**","   * Returns `true` if the runner has been closed by calling `close()`.","   */","  public isClosed(): boolean","}","```","","The module evaluator in `ModuleRunner` is responsible for executing the code. Vite exports `ESModulesEvaluator` out of the box, it uses `new AsyncFunction` to evaluate the code. You can provide your own implementation if your JavaScript runtime doesn't support unsafe evaluation.","","Module runner exposes `import` method. When Vite server triggers `full-reload` HMR event, all affected modules will be re-executed. Be aware that Module Runner doesn't update `exports` object when this happens (it overrides it), you would need to run `import` or get the module from `evaluatedModules` again if you rely on having the latest `exports` object.","","**Example Usage:**","","```js","import {","  ModuleRunner,","  ESModulesEvaluator,","  createNodeImportMeta,","} from 'vite/module-runner'","import { transport } from './rpc-implementation.js'","","const moduleRunner = new ModuleRunner(","  {","    transport,","    createImportMeta: createNodeImportMeta, // if the module runner runs in Node.js","  },","  new ESModulesEvaluator(),",")","","await moduleRunner.import('/src/entry-point.js')","```","","## `ModuleRunnerOptions`","","```ts twoslash","import type {","  InterceptorOptions as InterceptorOptionsRaw,","  ModuleRunnerHmr as ModuleRunnerHmrRaw,","  EvaluatedModules,","} from 'vite/module-runner'","import type { Debug } from '@type-challenges/utils'","","type InterceptorOptions = Debug\u003cInterceptorOptionsRaw>","type ModuleRunnerHmr = Debug\u003cModuleRunnerHmrRaw>","/** see below */","type ModuleRunnerTransport = unknown","","// ---cut---","interface ModuleRunnerOptions {","  /**","   * A set of methods to communicate with the server.","   */","  transport: ModuleRunnerTransport","  /**","   * Configure how source maps are resolved.","   * Prefers `node` if `process.setSourceMapsEnabled` is available.","   * Otherwise it will use `prepareStackTrace` by default which overrides","   * `Error.prepareStackTrace` method.","   * You can provide an object to configure how file contents and","   * source maps are resolved for files that were not processed by Vite.","   */","  sourcemapInterceptor?:","    | false","    | 'node'","    | 'prepareStackTrace'","    | InterceptorOptions","  /**","   * Disable HMR or configure HMR options.","   *","   * @default true","   */","  hmr?: boolean | ModuleRunnerHmr","  /**","   * Custom module cache. If not provided, it creates a separate module","   * cache for each module runner instance.","   */","  evaluatedModules?: EvaluatedModules","}","```","","## `ModuleEvaluator`","","**Type Signature:**","","```ts twoslash","import type { ModuleRunnerContext as ModuleRunnerContextRaw } from 'vite/module-runner'","import type { Debug } from '@type-challenges/utils'","","type ModuleRunnerContext = Debug\u003cModuleRunnerContextRaw>","","// ---cut---","export interface ModuleEvaluator {","  /**","   * Number of prefixed lines in the transformed code.","   */","  startOffset?: number","  /**","   * Evaluate code that was transformed by Vite.","   * @param context Function context","   * @param code Transformed code","   * @param id ID that was used to fetch the module","   */","  runInlinedModule(","    context: ModuleRunnerContext,","    code: string,","    id: string,","  ): Promise\u003cany>","  /**","   * evaluate externalized module.","   * @param file File URL to the external module","   */","  runExternalModule(file: string): Promise\u003cany>","}","```","","Vite exports `ESModulesEvaluator` that implements this interface by default. It uses `new AsyncFunction` to evaluate code, so if the code has inlined source map it should contain an [offset of 2 lines](https://tc39.es/ecma262/#sec-createdynamicfunction) to accommodate for new lines added. This is done automatically by the `ESModulesEvaluator`. Custom evaluators will not add additional lines.","","## `ModuleRunnerTransport`","","**Type Signature:**","","```ts twoslash","import type { ModuleRunnerTransportHandlers } from 'vite/module-runner'","/** an object */","type HotPayload = unknown","// ---cut---","interface ModuleRunnerTransport {","  connect?(handlers: ModuleRunnerTransportHandlers): Promise\u003cvoid> | void","  disconnect?(): Promise\u003cvoid> | void","  send?(data: HotPayload): Promise\u003cvoid> | void","  invoke?(data: HotPayload): Promise\u003c{ result: any } | { error: any }>","  timeout?: number","}","```","","Transport object that communicates with the environment via an RPC or by directly calling the function. When `invoke` method is not implemented, the `send` method and `connect` method is required to be implemented. Vite will construct the `invoke` internally.","","You need to couple it with the `HotChannel` instance on the server like in this example where module runner is created in the worker thread:","","::: code-group","","```js [worker.js]","import { parentPort } from 'node:worker_threads'","import { fileURLToPath } from 'node:url'","import {","  ESModulesEvaluator,","  ModuleRunner,","  createNodeImportMeta,","} from 'vite/module-runner'","","/** @type {import('vite/module-runner').ModuleRunnerTransport} */","const transport = {","  connect({ onMessage, onDisconnection }) {","    parentPort.on('message', onMessage)","    parentPort.on('close', onDisconnection)","  },","  send(data) {","    parentPort.postMessage(data)","  },","}","","const runner = new ModuleRunner(","  {","    transport,","    createImportMeta: createNodeImportMeta,","  },","  new ESModulesEvaluator(),",")","```","","```js [server.js]","import { BroadcastChannel } from 'node:worker_threads'","import { createServer, RemoteEnvironmentTransport, DevEnvironment } from 'vite'","","function createWorkerEnvironment(name, config, context) {","  const worker = new Worker('./worker.js')","  const handlerToWorkerListener = new WeakMap()","","  const workerHotChannel = {","    send: (data) => worker.postMessage(data),","    on: (event, handler) => {","      if (event === 'connection') return","","      const listener = (value) => {","        if (value.type === 'custom' && value.event === event) {","          const client = {","            send(payload) {","              worker.postMessage(payload)","            },","          }","          handler(value.data, client)","        }","      }","      handlerToWorkerListener.set(handler, listener)","      worker.on('message', listener)","    },","    off: (event, handler) => {","      if (event === 'connection') return","      const listener = handlerToWorkerListener.get(handler)","      if (listener) {","        worker.off('message', listener)","        handlerToWorkerListener.delete(handler)","      }","    },","  }","","  return new DevEnvironment(name, config, {","    transport: workerHotChannel,","  })","}","","await createServer({","  environments: {","    worker: {","      dev: {","        createEnvironment: createWorkerEnvironment,","      },","    },","  },","})","```","",":::","","A different example using an HTTP request to communicate between the runner and the server:","","```ts","import { ESModulesEvaluator, ModuleRunner } from 'vite/module-runner'","","export const runner = new ModuleRunner(","  {","    transport: {","      async invoke(data) {","        const response = await fetch(`http://my-vite-server/invoke`, {","          method: 'POST',","          body: JSON.stringify(data),","        })","        return response.json()","      },","    },","    hmr: false, // disable HMR as HMR requires transport.connect","  },","  new ESModulesEvaluator(),",")","","await runner.import('/entry.js')","```","","In this case, the `handleInvoke` method in the `NormalizedHotChannel` can be used:","","```ts","const customEnvironment = new DevEnvironment(name, config, context)","","server.onRequest((request: Request) => {","  const url = new URL(request.url)","  if (url.pathname === '/invoke') {","    const payload = (await request.json()) as HotPayload","    const result = customEnvironment.hot.handleInvoke(payload)","    return new Response(JSON.stringify(result))","  }","  return Response.error()","})","```","","But note that for HMR support, `send` and `connect` methods are required. The `send` method is usually called when the custom event is triggered (like, `import.meta.hot.send(\"my-event\")`).","","Vite exports `createServerHotChannel` from the main entry point to support HMR during Vite SSR."],"hunks":[{"lines":[{"kind":"context","text":"**Example Usage:**","old":149,"new":149},{"kind":"context","text":"","old":150,"new":150},{"kind":"context","text":"```js","old":151,"new":151},{"kind":"del","text":"import { ModuleRunner, ESModulesEvaluator } from 'vite/module-runner'","old":152},{"kind":"add","text":"import {","new":152},{"k <script>
verstat.register("test-coverage", (() => {
const CSS = `
.vs-tc-sum { font-size: 15px; margin-bottom: 12px; }
.vs-tc-sum b { font-weight: 600; }
.vs-tc-none { font-size: 13px; color: var(--vs-muted); }
.vs-tc-note { font-size: 12.5px; line-height: 1.4; color: var(--vs-muted); }
.vs-tc-frag { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.vs-tc-frag-name { font-family: var(--vs-mono); font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
.vs-tc-frag .vs-tc-note { font-size: 13.5px; line-height: 1.45; font-weight: 400; }
`;

if (typeof document !== 'undefined' && !document.getElementById('vs-css-test-coverage')) {
  const style = document.createElement('style');
  style.id = 'vs-css-test-coverage';
  style.textContent = CSS;
  document.head.appendChild(style);
}

const COLS = '28px 110px minmax(0, 1fr) minmax(0, 280px)';

function tcFragments(ctx) {
  const rows = [];
  for (const b of ctx.page.blocks || []) {
    if (b.type !== 'changes') continue;
    for (const file of b.files || []) {
      for (const fragment of file.fragments || []) {
        if (fragment.kind === 'read' || fragment.kind === 'skim') rows.push({ file, fragment });
      }
    }
  }
  return rows;
}

function tcDiff(block, ctx) {
  const { el } = ctx;
  const all = tcFragments(ctx);
  if (!all.length) return null;
  const covered = all.filter((r) => r.fragment.test).length;
  const head = el('div', { class: 'vs-table-row vs-table-head' }, [
    el('span', {}, '#'),
    el('span', {}, ctx.t('test-coverage.state')),
    el('span', {}, ctx.t('test-coverage.fragment')),
    el('span', { class: 'vs-table-code' }, ctx.t('test-coverage.test')),
  ]);
  return el('div', { class: 'vs-tc' }, [
    el('p', { class: 'vs-tc-sum' }, [el('b', {}, ctx.t('test-coverage.fragmentsOf', { covered, total: all.length })), ' ', ctx.plural(all.length, 'test-coverage.fragmentsCovered')]),
    el('div', { class: 'vs-table' }, el('div', { class: 'vs-table-grid', style: `--vs-table-cols:${COLS};--vs-table-min:600px` }, [
      head,
      ...all.map(({ file, fragment }, i) => {
        const test = fragment.test;
        const name = file.path.split('/').pop();
        return el('div', { class: `vs-table-row vs-tc-row${test ? '' : ' vs-tc-no'}` }, [
          el('span', { class: 'vs-table-num' }, String(i + 1).padStart(2, '0')),
          el('span', { class: `vs-state ${test ? 'vs-state-ok' : 'vs-state-problem'}` }, ctx.t(test ? 'test-coverage.covered' : 'test-coverage.notCovered')),
          el('div', { class: 'vs-table-main vs-tc-frag' }, [
            el('span', { class: 'vs-tc-frag-name', 'data-no-terms': true }, fragment.function ? `${name} · ${fragment.function}` : name),
            el('span', { class: 'vs-tc-note' }, test ? test.description : ctx.t('test-coverage.noTest')),
          ]),
          el('div', { class: 'vs-table-code vs-tc-tests' }, test ? el('div', { class: 'vs-chips' }, ctx.anchorChip(test.anchor, test.name)) : null),
        ]);
      }),
    ])),
  ]);
}

function verstatRender(block, ctx) {
  const { el } = ctx;
  if (block.mode === 'diff') return tcDiff(block, ctx);
  const all = block.behaviors || [];
  if (!all.length) return null;
  const covered = all.filter((b) => b.tests.length).length;
  const total = all.length;
  const head = el('div', { class: 'vs-table-row vs-table-head' }, [
    el('span', {}, '#'),
    el('span', {}, ctx.t('test-coverage.state')),
    el('span', {}, ctx.t('test-coverage.behavior')),
    el('span', { class: 'vs-table-code' }, ctx.t('test-coverage.test')),
  ]);
  return el('div', { class: 'vs-tc' }, [
    el('p', { class: 'vs-tc-sum' }, [el('b', {}, ctx.t('test-coverage.behaviorsOf', { covered, total })), ' ', ctx.plural(total, 'test-coverage.behaviorsPinned')]),
    el('div', { class: 'vs-table' }, el('div', { class: 'vs-table-grid', style: `--vs-table-cols:${COLS};--vs-table-min:600px` }, [
      head,
      ...all.map((b, i) => {
        const has = b.tests.length > 0;
        return ctx.part(el('div', { class: `vs-table-row vs-tc-row${has ? '' : ' vs-tc-no'}${ctx.isInferred(b) ? ' vs-inferred' : ''}` }, [
          el('span', { class: 'vs-table-num' }, String(i + 1).padStart(2, '0')),
          el('span', { class: `vs-state ${has ? 'vs-state-ok' : 'vs-state-problem'}` }, ctx.t(has ? 'test-coverage.covered' : 'test-coverage.notCovered')),
          el('span', { class: 'vs-table-main vs-tc-beh' }, b.behavior),
          el('div', { class: 'vs-table-code vs-tc-tests' }, [
            has ? el('div', { class: 'vs-chips' }, b.tests.map((t) => ctx.anchorChip(t.anchor, t.name))) : null,
            !has && !b.note ? el('span', { class: 'vs-tc-none' }, '—') : null,
            b.note ? el('span', { class: 'vs-tc-note' }, b.note) : null,
            b.source ? ctx.sourceChip(b.source) : null,
          ]),
        ]), b.id);
      }),
    ])),
  ]);
}

;return verstatRender;
})(), {"group":"reliability","label":"test coverage","diffMode":false});
</script>
